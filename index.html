<style>
/* Layout: sticky top bar, single column of sections (max 1080px); phone gets a bottom tab bar. Events are drawn as tear-off tickets. */
:root{
  --navy:#0B1033; --blue:#1F4FD8; --orange:#F04D24; --gold:#FFC83D;
  --ground:#F2F4FA; --card:#FFFFFF; --ink:#0B1033; --muted:#545C7A; --line:#DCE1EE; --soft:#E8ECF8;
  --ok:#14804A; --okbg:#E3F5EB; --bad:#C2311B; --badbg:#FDECE8;
  --f-display:"Archivo","Arial Black",Arial,sans-serif; --f-body:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif; --f-mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
  --demo-bg:#FFF4D6; --demo-ink:#5A4300; --demo-line:#F0D48A;
  --r:18px; color-scheme:light;
}
/* theme: follows the phone/computer setting, or the choice saved in Profile → Settings (data-theme) */
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --ground:#0A0E26; --card:#141A3A; --ink:#EEF1FB; --muted:#A6AECB; --line:#2A3260; --soft:#1C2350;
  --ok:#5BD08F; --okbg:#123A27; --bad:#FF8A73; --badbg:#3E1A14; --blue:#6E8BFF; --demo-bg:#3A3010; --demo-ink:#F5DE9B; --demo-line:#6B5A1E; color-scheme:dark}}
:root[data-theme="dark"]{
  --ground:#0A0E26; --card:#141A3A; --ink:#EEF1FB; --muted:#A6AECB; --line:#2A3260; --soft:#1C2350;
  --ok:#5BD08F; --okbg:#123A27; --bad:#FF8A73; --badbg:#3E1A14; --blue:#6E8BFF; --demo-bg:#3A3010; --demo-ink:#F5DE9B; --demo-line:#6B5A1E; color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--ground);color:var(--ink);font:16px/1.55 var(--f-body);-webkit-font-smoothing:antialiased;padding-bottom:env(safe-area-inset-bottom,0px)}
body.noscroll{overflow:hidden}
a{color:var(--blue)}
h1,h2,h3{font-family:var(--f-display);font-stretch:118%;line-height:1.08;text-wrap:balance;margin:0}
h2{font-size:clamp(22px,3.2vw,28px);font-weight:800}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
:focus-visible{outline:3px solid var(--orange);outline-offset:2px}
/* header */
#hdr{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:18px;padding:10px max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px));padding-top:calc(10px + env(safe-area-inset-top,0px));background:rgba(11,16,51,.94);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);color:#fff}
.logo{display:flex;align-items:baseline;gap:6px;text-decoration:none;color:#fff;flex:none}
.logo small{font:700 10px/1 var(--f-body);letter-spacing:.22em;text-transform:uppercase;color:#9FB0FF}
.wm{font-family:var(--f-display);font-stretch:125%;font-weight:900;letter-spacing:-.02em;font-size:22px}
.wm b{font-weight:900}.wm-up{color:var(--orange)}.wm-gr{color:#5B7BFF}
.nav{display:flex;gap:4px;margin-left:auto}
.nav a{color:#C9D2F5;text-decoration:none;font-weight:600;font-size:14px;padding:8px 12px;border-radius:999px}
.nav a.on{background:#fff;color:var(--navy)}
.nav a:hover:not(.on){background:rgba(255,255,255,.1)}
.lang{display:flex;border:1px solid rgba(255,255,255,.25);border-radius:999px;overflow:hidden;flex:none}
.lang button{background:none;border:0;color:#C9D2F5;font:700 12px var(--f-body);padding:7px 10px;cursor:pointer;min-height:32px}
.lang button.on{background:var(--orange);color:#fff}
#tabbar{display:none}
/* main */
#main{max-width:1080px;margin:0 auto;padding:20px max(16px,env(safe-area-inset-right,0px)) 40px max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:34px}
section{display:flex;flex-direction:column;gap:16px;min-width:0}
.sec-h{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.sec-h a{font-weight:600;text-decoration:none}
h1.pg{font-size:clamp(28px,5vw,40px);font-weight:900}
.kick{font:700 12px/1.2 var(--f-mono);letter-spacing:.14em;text-transform:uppercase;color:#9FB0FF}
.kick.o{color:var(--orange)}
.empty{color:var(--muted);background:var(--card);border:1px dashed var(--line);border-radius:var(--r);padding:18px;margin:0}
.demo{background:var(--demo-bg);color:var(--demo-ink);border:1px solid var(--demo-line);border-radius:12px;padding:10px 14px;font-size:14px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.row.c{justify-content:center}
/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:10px 18px;border-radius:999px;border:1.5px solid transparent;font:700 15px var(--f-body);text-decoration:none;cursor:pointer;transition:transform .15s,background .15s}
.btn:active{transform:scale(.97)}.btn:disabled{opacity:.55;cursor:wait}
.btn.big{min-height:52px;padding:12px 24px;font-size:16px}
.btn.small{min-height:36px;padding:6px 14px;font-size:13px}
.btn.primary{background:var(--orange);color:#fff}.btn.primary:hover{background:#D93E17}
.btn.dark{background:var(--navy);color:#fff}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line)}.btn.ghost:hover{border-color:var(--ink)}
.btn.glass{background:rgba(255,255,255,.14);color:#fff;border-color:rgba(255,255,255,.45);backdrop-filter:blur(10px)}
.btn.danger{background:transparent;color:var(--bad);border-color:currentColor}
.linkbtn{background:none;border:0;color:inherit;font:600 14px var(--f-body);cursor:pointer;padding:10px 0;min-height:44px;text-decoration:underline;text-underline-offset:3px}
.tag{display:inline-flex;align-items:center;gap:4px;font:700 12px/1 var(--f-body);padding:6px 10px;border-radius:999px;background:var(--soft);color:var(--muted)}
.tag.ok{background:var(--okbg);color:var(--ok)}.tag.full{background:var(--badbg);color:var(--bad)}.tag.today{background:var(--orange);color:#fff}
/* hero */
.hero{position:relative;border-radius:28px;overflow:hidden;background:var(--navy);color:#fff;min-height:340px;display:flex;flex-direction:row;align-items:flex-end}

.hero::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(11,16,51,.15) 0%,rgba(11,16,51,.75) 55%,rgba(11,16,51,.96) 100%)}
.hero-in{position:relative;z-index:1;padding:28px clamp(18px,4vw,44px) clamp(22px,4vw,40px);display:flex;flex-direction:column;gap:14px;max-width:760px}
.hero h1{font-size:clamp(32px,6.2vw,60px);font-weight:900;letter-spacing:-.01em}
.hero p{margin:0;color:#D6DDF7;font-size:17px;max-width:56ch}
/* study help band */
.help{flex-direction:row;align-items:center;justify-content:space-between;gap:20px;flex-wrap:wrap;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:22px clamp(18px,3vw,30px);position:relative;overflow:hidden}
.help::before{content:"Dr | Cr";position:absolute;right:-10px;bottom:-26px;font:900 110px/1 var(--f-display);font-stretch:125%;color:var(--soft);pointer-events:none}
.help-tx{position:relative;display:flex;flex-direction:column;gap:8px;max-width:62ch;min-width:0}
.help-tx p{margin:0;color:var(--muted)}
.help .btn{position:relative}
/* tickets (event cards) */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,330px),1fr));gap:16px}
.ticket{display:flex;background:var(--card);border-radius:var(--r);border:1px solid var(--line);position:relative;min-width:0}
.ticket.past{opacity:.6}
.t-main{flex:1;min-width:0;padding:18px 18px 16px;display:flex;flex-direction:column;gap:10px}
.t-meta{display:flex;flex-wrap:wrap;align-items:center;gap:6px;font:600 13px var(--f-mono);color:var(--muted)}
.ticket h3{font-size:20px;font-weight:800}
.ticket p{margin:0;color:var(--muted);font-size:14px}
.t-stub{flex:none;width:84px;border-left:2px dashed var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;position:relative;background:linear-gradient(180deg,transparent,var(--soft))}
.t-stub::before,.t-stub::after{content:"";position:absolute;left:-11px;width:20px;height:20px;border-radius:50%;background:var(--ground);border:1px solid var(--line)}
.t-stub::before{top:-11px;clip-path:inset(50% 0 0 0)}.t-stub::after{bottom:-11px;clip-path:inset(0 0 50% 0)}
.t-stub b{font:900 34px/1 var(--f-display);font-stretch:125%;color:var(--orange)}
.t-stub span{font:700 12px var(--f-mono);text-transform:uppercase;letter-spacing:.12em;color:var(--muted)}
.spots{display:flex;flex-direction:column;gap:6px;font-size:14px}
.spots .bar{height:8px;border-radius:99px;background:var(--soft);overflow:hidden}
.spots .bar i{display:block;height:100%;background:linear-gradient(90deg,var(--blue),var(--orange));border-radius:99px}
.spots small{color:var(--muted)}
.t-foot{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:4px}
.t-pts{margin-left:auto;font:700 13px var(--f-mono);color:var(--blue)}
.pastbox summary{cursor:pointer;font-weight:700;padding:10px 0;min-height:44px}
.pastbox .grid{margin-top:10px}
/* how it works */
.how ol{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr));gap:12px;counter-reset:s}
.how li{counter-increment:s;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px;display:flex;flex-direction:column;gap:4px}
.how li::before{content:counter(s);font:900 30px/1 var(--f-display);font-stretch:125%;color:var(--orange);margin-bottom:4px}
.how li span{color:var(--muted);font-size:14px}
/* leaderboard */
.board{list-style:none;margin:0;padding:0;background:var(--card);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.board li{display:flex;align-items:center;gap:14px;padding:12px 16px;border-top:1px solid var(--line)}
.board li:first-child{border-top:0}
.rk{width:30px;height:30px;flex:none;border-radius:50%;display:grid;place-items:center;font:800 14px var(--f-mono);background:var(--soft);color:var(--muted)}
.m1 .rk{background:var(--gold);color:#3A2A00}.m2 .rk{background:#CBD3E6;color:#20263F}.m3 .rk{background:#E8A87C;color:#3B1C07}
.nm{flex:1;min-width:0;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nm small{display:block;font:500 12px var(--f-mono);color:var(--muted)}
.sc{font:800 20px var(--f-display);font-stretch:118%;font-variant-numeric:tabular-nums}
.sc small{font:600 11px var(--f-body);color:var(--muted);margin-left:4px}
/* cards & forms */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:22px clamp(16px,3vw,28px)}
.card p{margin:0;color:var(--muted)}
.narrow{max-width:640px;width:100%}
.form{display:flex;flex-direction:column;gap:14px}
.form label{display:flex;flex-direction:column;gap:6px;font-weight:600;font-size:14px;min-width:0}
input,textarea{font:500 16px var(--f-body);color:var(--ink);background:var(--ground);border:1.5px solid var(--line);border-radius:12px;padding:11px 12px;min-height:46px;width:100%;min-width:0}
input:focus,textarea:focus{border-color:var(--blue);outline:none;box-shadow:0 0 0 3px color-mix(in srgb,var(--blue) 25%,transparent)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.inline{display:flex;gap:8px;align-items:stretch;flex-wrap:wrap}
.inline input{flex:1 1 160px;width:auto}
.pre{display:flex;align-items:center;padding:0 12px;border-radius:12px;background:var(--soft);font:700 15px var(--f-mono);color:var(--muted)}
.note{font-size:13px;color:var(--muted);margin:0}.note.c,.c{text-align:center}
.msg{margin:0;font-size:14px;color:var(--muted);min-height:1em}.msg.err{color:var(--bad)}
.mypts{display:flex;align-items:center;gap:18px;margin-top:14px;padding:16px;border-radius:14px;background:var(--navy);color:#fff}
.mypts .big{font:900 48px/1 var(--f-display);font-stretch:125%;color:var(--gold)}
.mypts .big small{font:700 14px var(--f-body);color:#C9D2F5;margin-left:6px}
.mypts span{display:block;color:#C9D2F5;font-size:14px}
/* QR ticket */
.tgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr));gap:16px}
.qr-ticket{background:#fff;color:#0B1033;border-radius:22px;padding:20px;display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center;border:1px solid #DCE1EE;position:relative;box-shadow:0 10px 30px rgba(11,16,51,.08)}
.qt-top{display:flex;justify-content:space-between;align-items:center;width:100%;font:700 11px var(--f-mono);letter-spacing:.12em;text-transform:uppercase;color:#545C7A}
.qt-top .wm{font-size:18px;text-transform:none;letter-spacing:-.02em}.qt-top .wm-gr{color:#1F4FD8}
.qr-ticket h3{font-size:19px;font-weight:800;margin-top:6px}
.qt-meta{display:flex;flex-direction:column;font:600 13px var(--f-mono);color:#545C7A}
.qt-qr{padding:6px;border-radius:14px;border:2px dashed #DCE1EE;line-height:0}
.qt-qr svg{width:min(220px,62vw);height:auto}
.qt-who b{display:block;font-size:17px}.qt-who span{font:600 13px var(--f-mono);color:#545C7A}
.qt-code{font:700 13px var(--f-mono);letter-spacing:.16em;color:#1F4FD8}
/* admin */
.alist{display:flex;flex-direction:column;gap:10px}
.arow{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px;display:flex;flex-direction:column;gap:10px}
.arow-h{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
.arow-h small{display:block;color:var(--muted);font:500 13px var(--f-mono)}
.cnt{font:800 20px var(--f-display);white-space:nowrap}.cnt b{color:var(--orange)}
.regs{overflow-x:auto}
.regs table{width:100%;border-collapse:collapse;font-size:14px;min-width:520px}
.regs th,.regs td{text-align:left;padding:8px;border-top:1px solid var(--line);vertical-align:middle}
.regs th{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.mono{font-family:var(--f-mono);white-space:nowrap}
.cam{position:relative;border-radius:16px;overflow:hidden;background:#000;aspect-ratio:1/1;max-width:100%}
.cam video{width:100%;height:100%;object-fit:cover;display:block}
.aim{position:absolute;inset:18%;border:3px solid rgba(255,255,255,.9);border-radius:18px;box-shadow:0 0 0 999px rgba(0,0,0,.35)}
.scan-ok,.scan-warn{margin-top:14px;border-radius:14px;padding:16px;display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center}
.scan-ok{background:var(--okbg);color:var(--ok)}.scan-ok b{font-size:20px;color:var(--ink)}.scan-ok span,.scan-ok small{color:var(--muted)}
.plus{font:900 52px/1 var(--f-display);font-stretch:125%}
.scan-warn{background:var(--badbg);color:var(--bad);font-weight:600}
/* modal */
#modal{position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;padding:16px}
.m-back{position:absolute;inset:0;background:rgba(6,9,30,.6);backdrop-filter:blur(4px)}
.m-box{position:relative;background:var(--card);border-radius:24px;padding:60px clamp(16px,4vw,28px) 22px;width:min(480px,100%);max-height:calc(100dvh - 32px);overflow:auto;display:flex;flex-direction:column;gap:12px;animation:mIn .25s ease-out}
@keyframes mIn{from{opacity:0;transform:translateY(16px) scale(.98)}}
.m-x{position:absolute;top:10px;right:10px;width:44px;height:44px;border-radius:50%;border:0;background:var(--soft);color:var(--ink);font-size:24px;cursor:pointer}
.m-sub{margin:0;color:var(--muted)}
/* footer */
#ftr{max-width:1080px;margin:0 auto;padding:20px max(16px,env(safe-area-inset-right,0px)) 30px max(16px,env(safe-area-inset-left,0px));display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;color:var(--muted);font-size:14px;border-top:1px solid var(--line)}
#ftr .wm{font-size:16px;margin-right:6px}#ftr .wm-gr{color:var(--blue)}
/* profile */
.seg{display:inline-flex;background:var(--soft);border-radius:999px;padding:4px;gap:4px;flex-wrap:wrap}
.seg button{border:0;background:transparent;color:var(--muted);font:700 14px var(--f-body);padding:8px 16px;min-height:40px;border-radius:999px;cursor:pointer}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:0 1px 4px rgba(11,16,51,.15)}
.phead{display:flex;flex-direction:row;align-items:center;text-align:left;gap:18px;flex-wrap:wrap;background:var(--navy);color:#fff;border-radius:var(--r);padding:22px clamp(16px,3vw,28px);position:relative;overflow:hidden}
.phead::after{content:"";position:absolute;right:-60px;top:-60px;width:220px;height:220px;border-radius:50%;background:radial-gradient(circle,rgba(240,77,36,.45),transparent 70%)}

.pinfo{flex:1;min-width:180px;position:relative;z-index:1;display:flex;flex-direction:column;gap:4px}

.pinfo span{color:#C9D2F5;font:500 14px var(--f-mono)}
.pinfo p{margin:6px 0 0;color:#E3E8FA;font-size:15px;max-width:60ch;white-space:pre-line}
.pstats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.pstats div{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:2px}
.pstats b{font:900 28px/1 var(--f-display);font-stretch:118%;font-variant-numeric:tabular-nums}
.pstats div:first-child b{color:var(--orange)}
.pstats span{font-size:13px;color:var(--muted)}
.setrow{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;padding:14px 0;border-top:1px solid var(--line)}

.msg.ok{color:var(--ok)}

.st-hero{min-height:0}
.st-hero::before{background:radial-gradient(circle at 85% 20%,rgba(240,77,36,.75),transparent 45%),radial-gradient(circle at 10% 90%,rgba(91,123,255,.6),transparent 50%),var(--navy);filter:none;opacity:1}

.tag.big{font-size:15px;padding:12px 16px;line-height:1.4;white-space:normal}

.pill input:focus-visible + span{outline:3px solid var(--orange);outline-offset:2px}
.dot{display:inline-grid;place-items:center;min-width:20px;height:20px;padding:0 6px;border-radius:99px;background:var(--orange);color:#fff;font-size:11px;margin-left:4px}
.score{flex:none;width:76px;border-radius:14px;padding:8px 6px;text-align:center;display:flex;flex-direction:column;gap:2px}
.score b{font:900 26px/1 var(--f-display);font-stretch:118%}
.score span{font-size:11px;font-weight:700}

  const ADMIN = String(CFG.ADMIN_EMAIL || '').toLowerCase();
  const withId = d => Object.assign({ id: d.id }, d.data());
  return {
    mode: 'firebase',
    watchEvents(cb, err) { return db.collection('events').onSnapshot(s => cb(s.docs.map(withId)), err); },
    watchTop(n, cb, err) { return db.collection('people').orderBy('points', 'desc').limit(n).onSnapshot(s => cb(s.docs.map(withId)), err); },
    async getPerson(pid) { const d = await db.doc('people/' + pid).get(); return d.exists ? withId(d) : null; },
    async getReg(rid) { const d = await db.doc('registrations/' + rid).get(); return d.exists ? withId(d) : null; },
    async register(eventId, f) {
      const personId = await personIdOf(f.phone), regId = eventId + '_' + personId;
      const evRef = db.doc('events/' + eventId), regRef = db.doc('registrations/' + regId), pRef = db.doc('people/' + personId);
      return db.runTransaction(async tx => {
        const ev = await tx.get(evRef), reg = await tx.get(regRef), p = await tx.get(pRef);
        if (!ev.exists) return { status: 'noevent' };
        if (reg.exists) return { status: 'exists', reg: withId(reg) };
        const e = ev.data(), taken = e.taken || 0;
        if (taken >= e.spots) return { status: 'full' };
        const r = { eventId, personId, name: f.name, group: f.group, phone: normPhone(f.phone), checkedIn: false, createdAt: Date.now() };
        tx.update(evRef, { taken: taken + 1, lastReg: regId });
        tx.set(regRef, r);
        if (!p.exists) tx.set(pRef, { name: f.name, group: f.group, points: 0, visits: 0 });
        return { status: 'ok', reg: Object.assign({ id: regId }, r) };
      });
    },
    onAuth(cb) {
      auth.onAuthStateChanged(u => {
        const em = String(u && u.email || '').toLowerCase();
        cb({ admin: !!u && em === ADMIN, user: u && /^\d{9}@/.test(em) && em.endsWith(ACC_DOMAIN) ? { uid: u.uid, phone: em.slice(0, 9) } : null });
      });
    },
    async adminLogin(code) {
      if (!ADMIN) return false;
      try { await auth.signInWithEmailAndPassword(ADMIN, code); return true; } catch (e) { return false; }
    },
    adminLogout() { return auth.signOut(); },
    signOut() { return auth.signOut(); },
    async signUp(f) {
      const phone = normPhone(f.phone);
      try {
        const cred = await auth.createUserWithEmailAndPassword(phone + ACC_DOMAIN, f.password);
        await this.saveProfile(cred.user.uid, phone, f);
        return { ok: true };
      } catch (e) { return { error: authErr(e) }; }
    },
    async signIn(phone, pw) {
      try { await auth.signInWithEmailAndPassword(normPhone(phone) + ACC_DOMAIN, pw); return { ok: true }; } catch (e) { return { error: authErr(e) }; }
    },
    async getProfile(uid) {
      const d = await db.doc('users/' + uid).get(); if (!d.exists) return null;
      const u = d.data(); const p = await db.doc('people/' + u.personId).get();
      return Object.assign({}, u, { points: p.exists ? p.data().points || 0 : 0, visits: p.exists ? p.data().visits || 0 : 0 });
    },
    async saveProfile(uid, phone, f) {
      const c = cleanProfile(f), personId = await personIdOf(phone);
      await db.doc('users/' + uid).set(Object.assign({ personId, phone: normPhone(phone) }, c, { updatedAt: Date.now() }));
      const pRef = db.doc('people/' + personId), p = await pRef.get();
      if (!p.exists) await pRef.set({ name: fullName(c), group: c.group, points: 0, visits: 0 });
      else await pRef.update({ name: fullName(c), group: c.group });
    },
    async changePassword(cur, next) {
      const u = auth.currentUser; if (!u) return { error: 'wrong' };
      try { await u.reauthenticateWithCredential(firebase.auth.EmailAuthProvider.credential(u.email, cur)); await u.updatePassword(next); return { ok: true }; }
      catch (e) { return { error: authErr(e) }; }
    },
    async saveEvent(ev, id) {
      if (id) { const { taken, ...rest } = ev; return db.doc('events/' + id).update(rest); }
      return db.collection('events').add(Object.assign({}, ev, { taken: 0, createdAt: Date.now() }));
    },
    deleteEvent(id) { return db.doc('events/' + id).delete(); },
    async submitStartup(a) { await db.collection('startups').add(Object.assign({}, a, { owner: a.phone + ACC_DOMAIN, status: 'new', createdAt: Date.now() })); return { ok: true }; },
    watchStartups(cb, err) { return db.collection('startups').orderBy('createdAt', 'desc').onSnapshot(s => cb(s.docs.map(withId)), err); },
    watchMyStartups(phone, cb, err) { return db.collection('startups').where('owner', '==', normPhone(phone) + ACC_DOMAIN).onSnapshot(s => cb(s.docs.map(withId).sort((a, b) => b.createdAt - a.createdAt)), err); },
    watchStartupNotes(cb, err) { return db.collection('startupNotes').onSnapshot(s => { const m = {}; s.docs.forEach(d => { m[d.id] = d.data().note || ''; }); cb(m); }, err); },
    updateStartup(id, ch) { return db.doc('startups/' + id).update(ch); },
    saveStartupNote(id, note) { return db.doc('startupNotes/' + id).set({ note }); },
    async deleteStartup(id) { await db.doc('startups/' + id).delete(); try { await db.doc('startupNotes/' + id).delete(); } catch (e) {} },
    async listRegs(eventId) { const s = await db.collection('registrations').where('eventId', '==', eventId).get(); return s.docs.map(withId); },
    async checkIn(regId) {
      const regRef = db.doc('registrations/' + regId);
      return db.runTransaction(async tx => {
        const reg = await tx.get(regRef); if (!reg.exists) return { status: 'notfound' };
        const r = reg.data(); const evRef = db.doc('events/' + r.eventId), pRef = db.doc('people/' + r.personId);
        const ev = await tx.get(evRef), p = await tx.get(pRef);
        const pts = ev.exists && ev.data().points ? ev.data().points : PTS_DEFAULT;
        const before = p.exists ? (p.data().points || 0) : 0;
        if (r.checkedIn) return { status: 'already', reg: withId(reg), total: before, event: ev.exists ? ev.data() : null };
        tx.update(regRef, { checkedIn: true, checkedAt: Date.now() });
        if (p.exists) tx.update(pRef, { points: inc(pts), visits: inc(1) });
        else tx.set(pRef, { name: r.name, group: r.group, points: pts, visits: 1 });
        return { status: 'ok', reg: withId(reg), pts, total: before + pts, event: ev.exists ? ev.data() : null };
      });
    }
  };
}

/* ---------- Demo (localStorage) ---------- */
function demoBackend() {
  const KEY = 'upg-demo-v1', subs = { ev: [], top: [] }; let admin = false; const authSubs = [];
  const LSdemo = v => { try { v ? localStorage.setItem('upg-demo-session', v) : localStorage.removeItem('upg-demo-session'); } catch (e) {} };
  let session = null; try { session = localStorage.getItem('upg-demo-session'); } catch (e) {}
  const pwHash = async pw => [...new Uint8Array(await crypto.subtle.digest('SHA-256', new TextEncoder().encode('demo-pw:' + pw)))].map(b => b.toString(16).padStart(2, '0')).join('');
  const state = () => ({ admin, user: session && S.users && S.users[session] ? { uid: session, phone: S.users[session].phone } : null });
  const emit = () => authSubs.forEach(f => f(state()));
  const load = () => { try { return JSON.parse(localStorage.getItem(KEY)) || null; } catch (e) { return null; } };
  let S = load();
  if (!S) {
    const today = new Date(); const iso = d => d.toISOString().slice(0, 10);
    const plus = n => { const d = new Date(today); d.setDate(d.getDate() + n); return iso(d); };
    S = { events: {
      demo1: { title: 'Avengers: Doomsday kechasi (demo)', desc: 'UPgrade kino kechasi. Bu demo tadbir — Firebase ulangach o‘chadi.', date: '2026-12-19', time: '17:00', place: '1-qavat, 101-xona', spots: 40, taken: 0, points: 40, createdAt: 1 },
      demo2: { title: 'Accounting yordam darsi (demo)', desc: 'Buxgalteriya kitobi bo‘yicha savol-javob. Demo tadbir.', date: plus(3), time: '15:00', place: '5-qavat', spots: 3, taken: 0, points: 40, createdAt: 2 }
    }, regs: {}, people: {} };
  }
  const save = () => { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} fire(); };
  const evList = () => Object.entries(S.events).map(([id, e]) => Object.assign({ id }, e));
  const topList = n => Object.entries(S.people).map(([id, p]) => Object.assign({ id }, p)).sort((a, b) => b.points - a.points).slice(0, n);
  function fire() { subs.ev.forEach(f => f(evList())); subs.top.forEach(([n, f]) => f(topList(n))); }
  const later = v => new Promise(r => setTimeout(() => r(v), 120));
  return {
    mode: 'demo',
    watchEvents(cb) { subs.ev.push(cb); setTimeout(() => cb(evList())); return () => { subs.ev = subs.ev.filter(f => f !== cb); }; },
    watchTop(n, cb) { const e = [n, cb]; subs.top.push(e); setTimeout(() => cb(topList(n))); return () => { subs.top = subs.top.filter(x => x !== e); }; },
    async getPerson(pid) { return later(S.people[pid] ? Object.assign({ id: pid }, S.people[pid]) : null); },
    async getReg(rid) { return later(S.regs[rid] ? Object.assign({ id: rid }, S.regs[rid]) : null); },
    async register(eventId, f) {
      const personId = await personIdOf(f.phone), regId = eventId + '_' + personId, e = S.events[eventId];
      if (!e) return { status: 'noevent' };
      if (S.regs[regId]) return { status: 'exists', reg: Object.assign({ id: regId }, S.regs[regId]) };
      if ((e.taken || 0) >= e.spots) return { status: 'full' };
      const r = { eventId, personId, name: f.name, group: f.group, phone: normPhone(f.phone), checkedIn: false, createdAt: Date.now() };
      e.taken = (e.taken || 0) + 1; S.regs[regId] = r;
      if (!S.people[personId]) S.people[personId] = { name: f.name, group: f.group, points: 0, visits: 0 };
      save(); return later({ status: 'ok', reg: Object.assign({ id: regId }, r) });
    },
    onAuth(cb) { authSubs.push(cb); cb(state()); },
    async adminLogin(code) { admin = code === '1234'; if (admin) session = null; emit(); return later(admin); },
    adminLogout() { admin = false; emit(); return later(); },
    signOut() { admin = false; session = null; LSdemo(null); emit(); return later(); },
    async signUp(f) {
      const phone = normPhone(f.phone); S.users = S.users || {};
      if (Object.values(S.users).some(u => u.phone === phone)) return later({ error: 'exists' });
      if (String(f.password).length < 6) return later({ error: 'weak' });
      const uid = 'u' + Date.now().toString(36); S.users[uid] = { phone, pw: await pwHash(f.password) };
      await this.saveProfile(uid, phone, f); session = uid; admin = false; LSdemo(uid); emit(); return later({ ok: true });
    },
    async signIn(phone, pw) {
      const d = normPhone(phone), h = await pwHash(pw), e = Object.entries(S.users || {}).find(([, u]) => u.phone === d && u.pw === h);
      if (!e) return later({ error: 'wrong' }); session = e[0]; admin = false; LSdemo(session); emit(); return later({ ok: true });
    },
    async getProfile(uid) {
      const u = (S.users || {})[uid]; if (!u || !u.profile) return later(null); const p = S.people[u.profile.personId] || {};
      return later(Object.assign({}, u.profile, { points: p.points || 0, visits: p.visits || 0 }));
    },
    async saveProfile(uid, phone, f) {
      const c = cleanProfile(f), personId = await personIdOf(phone);
      S.users[uid].profile = Object.assign({ personId, phone: normPhone(phone) }, c, { updatedAt: Date.now() });
      if (!S.people[personId]) S.people[personId] = { name: fullName(c), group: c.group, points: 0, visits: 0 };
      else Object.assign(S.people[personId], { name: fullName(c), group: c.group });
      save(); return later();
    },
    async changePassword(cur, next) {
      const u = (S.users || {})[session]; if (!u || u.pw !== await pwHash(cur)) return later({ error: 'wrong' });
      if (String(next).length < 6) return later({ error: 'weak' }); u.pw = await pwHash(next); try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} return later({ ok: true });
    },
    async saveEvent(ev, id) {
      if (id) { const { taken, ...rest } = ev; Object.assign(S.events[id], rest); }
      else S.events['e' + Date.now().toString(36)] = Object.assign({}, ev, { taken: 0, createdAt: Date.now() });
      save(); return later();
    },
    async deleteEvent(id) { delete S.events[id]; save(); return later(); },
    async submitStartup(a) { S.startups = S.startups || {}; S.startups['s' + Date.now().toString(36)] = Object.assign({}, a, { owner: a.phone + ACC_DOMAIN, status: 'new', createdAt: Date.now() }); save(); return later({ ok: true }); },
    watchMyStartups(phone, cb) { const own = normPhone(phone) + ACC_DOMAIN; const f = () => cb(Object.entries(S.startups || {}).filter(([, x]) => x.owner === own).map(([id, x]) => Object.assign({ id }, x)).sort((a, b) => b.createdAt - a.createdAt)); subs.ev.push(f); setTimeout(f); return () => { subs.ev = subs.ev.filter(g => g !== f); }; },
    watchStartupNotes(cb) { const f = () => cb(Object.assign({}, S.stNotes || {})); subs.ev.push(f); setTimeout(f); return () => { subs.ev = subs.ev.filter(g => g !== f); }; },
    async saveStartupNote(id, note) { S.stNotes = S.stNotes || {}; S.stNotes[id] = note; save(); return later(); },
    watchStartups(cb) { const f = () => cb(Object.entries(S.startups || {}).map(([id, x]) => Object.assign({ id }, x)).sort((a, b) => b.createdAt - a.createdAt)); subs.ev.push(f); setTimeout(f); return () => { subs.ev = subs.ev.filter(g => g !== f); }; },
    async updateStartup(id, ch) { Object.assign(S.startups[id], ch); save(); return later(); },
    async deleteStartup(id) { delete S.startups[id]; if (S.stNotes) delete S.stNotes[id]; save(); return later(); },
    async listRegs(eventId) { return later(Object.entries(S.regs).filter(([, r]) => r.eventId === eventId).map(([id, r]) => Object.assign({ id }, r))); },
    async checkIn(regId) {
      const r = S.regs[regId]; if (!r) return later({ status: 'notfound' });
      const e = S.events[r.eventId], p = S.people[r.personId] || (S.people[r.personId] = { name: r.name, group: r.group, points: 0, visits: 0 });
      if (r.checkedIn) return later({ status: 'already', reg: Object.assign({ id: regId }, r), total: p.points, event: e });
      const pts = (e && e.points) || PTS_DEFAULT; r.checkedIn = true; r.checkedAt = Date.now(); p.points += pts; p.visits += 1;
      save(); return later({ status: 'ok', reg: Object.assign({ id: regId }, r), pts, total: p.points, event: e });
    }
  };
}

const todayISO = () => { const d = new Date(); return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`; };
const upcoming = () => EVENTS.filter(e => e.date >= todayISO()).sort((a, b) => (a.date + a.time).localeCompare(b.date + b.time));

/* ---------- small renderers ---------- */
function wordmark() { return '<span class="wm"><b class="wm-up">UP</b><b class="wm-gr">grade</b></span>'; }
function dateParts(iso) { const [y, m, d] = String(iso || '').split('-').map(Number); return { d: d || '', m: (MONTHS[LANG] || MONTHS.uz)[(m || 1) - 1], y }; }
function spotsLeft(e) { return Math.max(0, (e.spots || 0) - (e.taken || 0)); }
function eventCard(e, opts = {}) {
  const dp = dateParts(e.date), left = spotsLeft(e), pct = e.spots ? Math.min(100, Math.round((e.taken || 0) / e.spots * 100)) : 0;
  const isPast = e.date < todayISO(), isToday = e.date === todayISO();
  const mine = Object.values(tickets()).find(r => r.eventId === e.id);
  let action;
  if (isPast) action = `<span class="tag muted">${t('ended')}</span>`;
  else if (mine) action = `<button class="btn ghost" data-act="ticket" data-id="${esc(mine.id)}">${t('showTicket')}</button>`;
  else if (!left) action = `<span class="tag full">${t('full')}</span>`;
  else action = `<button class="btn primary" data-act="register" data-id="${esc(e.id)}">${t('register')}</button>`;
  return `<article class="ticket${isPast ? ' past' : ''}">
    <div class="t-main">
      <div class="t-meta">${isToday ? `<span class="tag today">${t('today')}</span>` : ''}<span>${esc(e.time || '')}</span><span>·</span><span>${esc(e.place || '')}</span></div>
      <h3>${esc(e.title)}</h3>
      ${e.desc && !opts.compact ? `<p>${esc(e.desc)}</p>` : ''}
      <div class="spots"><div class="bar"><i style="width:${pct}%"></i></div><span><b>${left}</b> ${t('spotsLeft')} <small>· ${esc(e.taken || 0)}/${esc(e.spots)}</small></span></div>
      <div class="t-foot">${action}${mine ? `<span class="tag ok">${t('registered')}</span>` : ''}<span class="t-pts">+${esc(e.points || PTS_DEFAULT)} ${t('pts')}</span></div>
    </div>
    <div class="t-stub" aria-hidden="true"><b>${dp.d}</b><span>${dp.m}</span></div>
  </article>`;
}
function leaderboard(list) {
  list = list.filter(p => (p.points || 0) > 0);
  if (!list.length) return `<p class="empty">${t('noLeader')}</p>`;
  return `<ol class="board">${list.map((p, i) => `<li class="${i < 3 ? 'm' + (i + 1) : ''}"><span class="rk">${i + 1}</span><span class="nm">${esc(p.name)}<small>${esc(p.group)}</small></span><span class="sc">${esc(p.points)}<small>${t('pts')}</small></span></li>`).join('')}</ol>`;
}

async function submitRegister(f) {
  const id = f.dataset.id, name = $('#r-name').value.trim().replace(/\s+/g, ' '), group = $('#r-group').value.trim().toUpperCase(), phone = $('#r-phone').value;
  const msg = $('#regMsg');
  if (name.length < 2) return msg.textContent = t('errName');
  if (!group) return msg.textContent = t('errGroup');
  if (!normPhone(phone) || String(phone).replace(/\D/g, '').length > 12) return msg.textContent = t('errPhone');
  const btn = f.querySelector('.btn.primary'); btn.disabled = true; msg.textContent = '';
  try {
    const r = await API.register(id, { name, group, phone });
    LS.set('me', { name, group }); LS.set('phone', normPhone(phone));
    if (r.status === 'full') { msg.textContent = t('errFull'); btn.disabled = false; return; }
    if (r.status === 'noevent') { msg.textContent = t('notFound'); btn.disabled = false; return; }
    saveTicket(r.reg);
    modal(`${r.status === 'exists' ? `<p class="m-sub">${t('already')}</p>` : ''}${ticketHTML(r.reg)}<p class="note c">${t('ticketP')}</p><div class="row c"><a class="btn primary" href="#tickets" data-act="close">${t('tickets')}</a></div>`);

}

async function findTickets(phone) {
  const out = $('#findMsg'); if (!normPhone(phone)) { out.textContent = t('errPhone'); return; }
  LS.set('phone', normPhone(phone)); out.textContent = '…';
  try {
    const pid = await personIdOf(phone); let n = 0;
    for (const e of EVENTS) { const r = await API.getReg(e.id + '_' + pid); if (r) { saveTicket(r); n++; } }

}
async function showPoints(phone) {

// Transparent checklist score (0-100) shown only to admins
function startupScore(a) {
  const len = (s, steps) => { const n = String(s || '').length; for (const [min, pts] of steps) if (n >= min) return pts; return 0; };
  const parts = [
    ['cr_problem', len(a.problem, [[150, 20], [80, 14], [30, 8], [1, 3]]), 20],
    ['cr_audience', len(a.audience, [[120, 15], [60, 10], [20, 6], [1, 2]]), 15],
    ['cr_solution', len(a.solution, [[120, 15], [60, 10], [20, 6], [1, 2]]), 15],
    ['cr_talked', { '0': 0, '1-5': 8, '6-20': 15, '20+': 20 }[a.talked] || 0, 20],
    ['cr_stage', { idea: 5, proto: 10, users: 15 }[a.stage] || 0, 15],
    ['cr_team', { '1': 4, '2': 8, '4': 7 }[a.team] || 0, 8],
    ['cr_hours', { '<3': 0, '3-10': 4, '10+': 7 }[a.hours] || 0, 7]
  ];
  const total = parts.reduce((s, p) => s + p[1], 0);
  return { total, parts, lvl: total >= 75 ? 'strong' : total >= 50 ? 'mid' : 'raw' };
}
function adminStartups() {
  const list = STARTUPS.filter(x => ST_FILTER === 'all' || x.status === ST_FILTER);

  return `<section><div class="seg">${f.map(k => `<button data-act="stfilter" data-id="${k}" class="${ST_FILTER === k ? 'on' : ''}">${k === 'all' ? t('stAll') : t('st_' + k)} (${k === 'all' ? STARTUPS.length : STARTUPS.filter(x => x.status === k).length})</button>`).join('')}</div>

function stCard(a) {
  const sc = startupScore(a), d = new Date(a.createdAt || 0);
  const when = `${d.getDate()} ${(MONTHS[LANG] || MONTHS.uz)[d.getMonth()]}, ${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}`;
  const q = (k, v) => v ? `<div class="qa"><b>${t(k)}</b><p>${esc(v)}</p></div>` : '';
  return `<article class="arow st-card st-${esc(a.status)}" data-id="${esc(a.id)}">
    <div class="arow-h"><div><b>${esc(a.title)}</b><small>${esc(a.name)} · ${esc(a.group)} · ${when}</small></div>
      <div class="score s-${sc.lvl}" title="${t('stScore')}"><b>${sc.total}</b><span>${t('lvl_' + sc.lvl)}</span></div></div>
    <div class="row chips"><span class="tag">${esc(t('stage_' + a.stage))}</span><span class="tag">${t('cr_talked')}: ${esc(a.talked)}</span><span class="tag">${esc(t('team_' + a.team))}</span><span class="tag">${esc(a.hours)} ${LANG === 'en' ? 'h/wk' : 'soat/hafta'}</span><span class="tag st-${esc(a.status)}">${t('st_' + (a.status || 'new'))}</span></div>
    <details data-st="${esc(a.id)}"${OPEN_ST.has(a.id) ? ' open' : ''}><summary>${t('details')}</summary>
      <div class="bars">${sc.parts.map(([k, v, max]) => `<div class="sbar"><span>${t(k)}</span><i><u style="width:${Math.round(v / max * 100)}%"></u></i><em>${v}/${max}</em></div>`).join('')}</div>
      ${q('fProblem', a.problem)}${q('fAudience', a.audience)}${q('fSolution', a.solution)}${q('fNeed', a.need)}
      <div class="qa"><b>${t('fPhone')}</b><p class="mono">${esc(fmtPhone(a.phone))}${a.telegram ? ' · ' + esc(a.telegram) : ''}</p></div>
      <label class="form">${t('adminNote')}<textarea data-note="${esc(a.id)}" rows="2" maxlength="500">${esc(ST_NOTES[a.id] || '')}</textarea></label>
    </details>
    <div class="row">${['good', 'maybe', 'no'].map(k => `<button class="btn small ${a.status === k ? 'primary' : 'ghost'}" data-act="ststatus" data-id="${esc(a.id)}" data-v="${k}">${t('st_' + k)}</button>`).join('')}
      <button class="btn small ghost" data-act="stnote" data-id="${esc(a.id)}">${t('save')}</button><button class="btn small danger" data-act="stdel" data-id="${esc(a.id)}">${t('del')}</button></div>
  </article>`;
}
function watchStartupsIfAdmin() {
  if (IS_ADMIN && !stUnsub) {
    stUnsub = API.watchStartups(list => { STARTUPS = list; if (ROUTE === 'admin') softRender(); }, e => console.warn(e));
    notesUnsub = API.watchStartupNotes(m => { ST_NOTES = m; }, e => console.warn(e));
  }
  if (!IS_ADMIN && stUnsub) { stUnsub(); stUnsub = null; STARTUPS = []; if (notesUnsub) { notesUnsub(); notesUnsub = null; } ST_NOTES = {}; }
}

/* ---------- admin ---------- */
function openLogin() {
  modal(`<h2>${t('adminH')}</h2><p class="m-sub">${t('adminP')}</p>
    <form id="loginF" class="form"><label>${t('fCode')}<input id="a-code" type="password" required autocomplete="current-password"></label>
    <p id="loginMsg" class="msg err" role="alert"></p><div class="row"><button class="btn primary">${t('enter')}</button></div></form>`);
}
async function submitLogin() {
  const ok = await API.adminLogin($('#a-code').value);
  if (!ok) { $('#loginMsg').textContent = t('wrongCode'); return; }
  closeModal(); location.hash = '#admin'; route();
}
async function submitEvent(f) {
  const id = f.dataset.id || null, v = k => $('#ev-' + k).value.trim();
  const ev = { title: v('title'), date: v('date'), time: v('time'), place: v('place'), spots: parseInt(v('spots'), 10), points: parseInt(v('points'), 10), desc: v('desc') };
  const msg = $('#evMsg');
  if (!ev.title || !ev.date || !ev.time || !ev.place || !(ev.spots > 0) || !(ev.points >= 0)) { msg.textContent = '!'; return; }
  try { await API.saveEvent(ev, id); msg.textContent = t('saved'); setTimeout(() => { if (ROUTE === 'admin') { render(); } }, 700); }
  catch (e) { console.warn(e); msg.textContent = t('errNet'); }
}
const OPEN_REGS = new Set();
async function showRegs(id, refresh) {
  const box = $('#regs-' + CSS.escape(id)); if (!box) return;
  if (!refresh && OPEN_REGS.has(id)) { box.innerHTML = ''; OPEN_REGS.delete(id); return; }
  OPEN_REGS.add(id); if (!box.innerHTML) box.innerHTML = '<p class="msg">…</p>';
  try {
    const list = (await API.listRegs(id)).sort((a, b) => (a.createdAt || 0) - (b.createdAt || 0));
    box.innerHTML = list.length ? `<table><thead><tr><th>#</th><th>${t('fName')}</th><th>${t('fGroup')}</th><th>${t('fPhone')}</th><th></th></tr></thead><tbody>${list.map((r, i) => `<tr><td>${i + 1}</td><td>${esc(r.name)}</td><td>${esc(r.group)}</td><td class="mono">${esc(fmtPhone(r.phone))}</td><td>${r.checkedIn ? '<span class="tag ok">✓</span>' : `<button class="btn small primary" data-act="checkin" data-id="${esc(r.id)}" data-ev="${esc(id)}">${t('checkin')}</button>`}</td></tr>`).join('')}</tbody></table>` : `<p class="empty">${t('noRegs')}</p>`;
  } catch (e) { box.innerHTML = `<p class="msg err">${t('errNet')}</p>`; }
}
async function doCheckIn(regId) {
  const r = await API.checkIn(regId);
  if (r.status === 'ok') { tone(true); return { ok: true, html: `<div class="scan-ok"><div class="plus">+${esc(r.pts)}</div><b>${esc(r.reg.name)}</b><span>${esc(r.reg.group)} · ${t('total')}: ${esc(r.total)} ${t('pts')}</span><small>${esc(r.event ? r.event.title : '')}</small></div>` }; }
  tone(false);
  if (r.status === 'already') return { ok: false, html: `<div class="scan-warn"><b>${esc(r.reg.name)}</b><span>${t('alreadyIn')}</span></div>` };
  return { ok: false, html: `<div class="scan-warn"><span>${t('notFound')}</span></div>` };
}
function tone(ok) { // no sound: a short vibration on the admin's phone after a scan
  try { if (navigator.vibrate) navigator.vibrate(ok ? 60 : [80, 60, 80]); } catch (e) {}
}

/* ---------- QR scanner ---------- */
let SCAN = null;
function loadJsQR() { return new Promise((res, rej) => { if (window.jsQR) return res(window.jsQR); const s = document.createElement('script'); s.src = 'https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js'; s.onload = () => res(window.jsQR); s.onerror = rej; document.head.appendChild(s); }); }
async function openScanner() {
  modal(`<h2>${t('scan')}</h2><p class="m-sub">${t('scanP')}</p><div class="cam"><video id="camV" playsinline muted></video><div class="aim"></div></div><div id="scanOut" role="status"></div>`, stopScanner);
  const out = $('#scanOut');
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' }, audio: false });
    const v = $('#camV'); v.srcObject = stream; await v.play();
    let detect;
    if ('BarcodeDetector' in window) { try { const bd = new BarcodeDetector({ formats: ['qr_code'] }); detect = async () => { const r = await bd.detect(v); return r[0] && r[0].rawValue; }; } catch (e) {} }
    if (!detect) { const jsQR = await loadJsQR(); const cv = document.createElement('canvas'), cx = cv.getContext('2d', { willReadFrequently: true });
      detect = async () => { if (!v.videoWidth) return null; cv.width = v.videoWidth; cv.height = v.videoHeight; cx.drawImage(v, 0, 0); const im = cx.getImageData(0, 0, cv.width, cv.height); const r = jsQR(im.data, im.width, im.height); return r && r.data; }; }
    SCAN = { stream, busy: false, timer: null };
    const loop = async () => {
      if (!SCAN) return;
      if (!SCAN.busy) {
        let txt = null; try { txt = await detect(); } catch (e) {}
        if (txt && SCAN) {
          SCAN.busy = true;
          if (!/^UPG1:/.test(txt)) { tone(false); out.innerHTML = `<div class="scan-warn"><span>${t('badQR')}</span></div>`; setTimeout(() => { if (SCAN) { SCAN.busy = false; out.innerHTML = ''; } }, 1500); }
          else {
            let res; try { res = await doCheckIn(txt.slice(5)); } catch (e) { res = { html: `<div class="scan-warn"><span>${t('errNet')}</span></div>` }; }
            out.innerHTML = res.html + `<div class="row c"><button class="btn primary" data-act="scannext">${t('next')}</button></div>`;
          }
        }
      }
      if (SCAN) SCAN.timer = setTimeout(loop, 220);
    };
    loop();
  } catch (e) { console.warn(e); out.innerHTML = `<p class="msg err">${t('camErr')}</p>`; }
}
function stopScanner() { if (SCAN) { clearTimeout(SCAN.timer); SCAN.stream.getTracks().forEach(tr => tr.stop()); SCAN = null; } }

/* ---------- events (delegated) ---------- */
document.addEventListener('click', async ev => {
  const a = ev.target.closest('[data-act],[data-lang]'); if (!a) return;
  if (a.dataset.lang) { LANG = a.dataset.lang; LS.set('lang', LANG); render(); return; }
  const id = a.dataset.id, act = a.dataset.act;
  if (!(act === 'close' && a.tagName === 'A')) ev.preventDefault();
  if (act === 'register') openRegister(id);
  else if (act === 'ticket') showTicket(id);
  else if (act === 'close') closeModal();
  else if (act === 'login') openLogin();
  else if (act === 'admin') location.hash = '#admin';
  else if (act === 'logout') { await API.adminLogout(); location.hash = '#home'; }
  else if (act === 'signout') { await API.signOut(); PROFILE = null; AUTH_TAB = 'in'; render(); }
  else if (act === 'authtab') { AUTH_TAB = id; render(); }
  else if (act === 'theme') { LS.set('theme', id); applyTheme(id); render(); }
  else if (act === 'atab') { ADMIN_TAB = id; render(); }
  else if (act === 'stfilter') { ST_FILTER = id; render(); }
  else if (act === 'ststatus') { await API.updateStartup(id, { status: a.dataset.v }); }
  else if (act === 'stnote') { const ta = document.querySelector(`textarea[data-note="${CSS.escape(id)}"]`); if (ta) { await API.saveStartupNote(id, ta.value.slice(0, 500)); a.textContent = '✓ ' + t('saved'); } }
  else if (act === 'stdel') { if (a.dataset.sure) await API.deleteStartup(id); else { a.dataset.sure = '1'; a.textContent = t('delSure'); setTimeout(() => { if (a.isConnected) { delete a.dataset.sure; a.textContent = t('del'); } }, 4000); } }
  else if (act === 'scan') openScanner();
  else if (act === 'scannext') { $('#scanOut').innerHTML = ''; if (SCAN) SCAN.busy = false; }
  else if (act === 'regs') showRegs(id);
  else if (act === 'checkin') { a.disabled = true; const r = await doCheckIn(id); const td = a.parentElement; td.innerHTML = r.ok ? '<span class="tag ok">✓ +' + esc((r.html.match(/\+(\d+)/) || [])[1] || '') + '</span>' : '<span class="tag muted">✓</span>'; }
  else if (act === 'edit') { const e = EVENTS.find(x => x.id === id); const c = $('#evF').parentElement; c.innerHTML = `<h2 id="evFormH">${t('editEvent')}</h2>` + eventForm(e); c.scrollIntoView({ behavior: 'smooth', block: 'start' }); }
  else if (act === 'newform') { const c = $('#evF').parentElement; c.innerHTML = `<h2 id="evFormH">${t('newEvent')}</h2>` + eventForm(); }
  else if (act === 'del') { if (a.dataset.sure) { await API.deleteEvent(id); } else { a.dataset.sure = '1'; a.textContent = t('delSure'); setTimeout(() => { if (a.isConnected) { delete a.dataset.sure; a.textContent = t('del'); } }, 4000); } }
});
document.addEventListener('submit', ev => {
  ev.preventDefault(); const f = ev.target;
  if (f.id === 'regF') submitRegister(f);
  else if (f.id === 'loginF') submitLogin();
  else if (f.id === 'evF') submitEvent(f);
  else if (f.id === 'findF') findTickets($('#findPhone').value);
  else if (f.id === 'ptsF') showPoints($('#ptsPhone').value);
  else if (f.id === 'inF') submitSignIn();
  else if (f.id === 'upF') submitSignUp();
  else if (f.id === 'profF') submitProfile();
  else if (f.id === 'pwF') submitPassword();
  else if (f.id === 'stF') submitStartup();
});
document.addEventListener('toggle', e => { const d = e.target; if (d.dataset && d.dataset.st) { d.open ? OPEN_ST.add(d.dataset.st) : OPEN_ST.delete(d.dataset.st); } }, true);
document.addEventListener('keydown', e => { if (e.key === 'Escape' && $('#modal')) closeModal(); });
window.addEventListener('hashchange', route);

/* ---------- live data ---------- */
let renderT = null;
function softRender() { // re-render on data change, but never while the user is typing in a form
  clearTimeout(renderT);
  renderT = setTimeout(() => { const a = document.activeElement; if (a && /INPUT|TEXTAREA|SELECT/.test(a.tagName) && !$('#modal')) return softRender(); const b = $('#board'); if (ROUTE === 'admin' && $('#evF') && $('#evF').dataset.id) return; render(); }, 60);
}
API.watchEvents(list => { EVENTS = list; softRender(); }, e => console.warn(e));
API.watchTop(10, list => { TOP = list; const b = $('#board'); if (b) b.innerHTML = leaderboard(TOP); }, e => console.warn(e));
API.onAuth(async st => {
  IS_ADMIN = !!st.admin; const was = USER && USER.uid; USER = st.user; if (!USER) PROFILE = null;
  if (USER && USER.uid !== was) {
    LS.set('phone', USER.phone);
    try { PROFILE = await API.getProfile(USER.uid); } catch (e) { console.warn(e); }
    syncTickets(USER.phone);
  }
  if ((USER && USER.uid) !== was) watchMyApps();
  watchStartupsIfAdmin();
  if (!IS_ADMIN && ROUTE === 'admin') render(); else softRender();
});
route();

window.API = API;
});
</script>
