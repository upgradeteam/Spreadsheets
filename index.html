<!DOCTYPE html>
<html lang="uz"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Accounting Workbook · Buxgalteriya kitobi · UPgrade Council</title><meta name="author" content="UPgrade Council"><link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%231F4FD8'/%3E%3Ctext x='32' y='43' font-family='Arial Black,Arial' font-weight='900' font-size='30' text-anchor='middle' fill='%23fff'%3EUP%3C/text%3E%3Crect x='14' y='50' width='36' height='5' rx='2.5' fill='%23F04D24'/%3E%3C/svg%3E"><meta name="description" content="Accounting and Spreadsheets workbook created by UPgrade Council">
<style>:root{--paper:#fbf8f2;--ink:#1f2328;--muted:#5f6670;--line:#e3ddd0;--accent:#0f6b5c;--accent2:#c8553d;--soft:#eef5f2;--dr:#2a6fb0;--cr:#b4442f;--ok:#1f8a4c;--bad:#c0392b;--card:#fff}
*{box-sizing:border-box}
html,body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.6 "Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif}
h1,h2,h3,.brand,.cover h1{font-family:Georgia,"Times New Roman",serif}
.kicker{text-transform:uppercase;letter-spacing:.08em;font-size:12px;color:var(--accent2);font-weight:700}
h3{font-size:19px;margin:22px 0 6px}
p{margin:10px 0}
.chprog,.bigprog{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--muted)}
.bar{flex:1;height:8px;background:#e6e0d3;border-radius:6px;overflow:hidden;max-width:320px}.bar i{display:block;height:100%;background:var(--accent)}
.box{border-radius:10px;padding:12px 16px;margin:16px 0;border:1px solid}
.box-h{font-weight:700;font-size:13px;text-transform:uppercase;letter-spacing:.04em;margin-bottom:4px}
.box.rule{background:var(--soft);border-color:#bcd9cf}
.box.trap{background:#fdf0ec;border-color:#efc2b6}
.box.tip{background:#fff8e5;border-color:#f1dea3}
.box.uz{background:#f1f0fb;border-color:#cfcbef}
.box.key{background:#fff;border-color:var(--accent);border-width:2px}
.box.note{background:#f6f6f6;border-color:#ddd}
.box p:first-of-type{margin-top:0}
.fig{margin:18px 0;background:#fff;border:1px solid var(--line);border-radius:12px;padding:16px;overflow-x:auto}
.fig figcaption{font-size:13px;color:var(--muted);margin-top:8px;text-align:center}
.tblwrap{overflow-x:auto;margin:14px 0}.tcap{font-weight:600;margin-bottom:4px}
.tbl{border-collapse:collapse;width:100%;background:#fff;font-size:14.5px}
.tbl th{background:#efe9dc;text-align:left;padding:7px 10px;border:1px solid var(--line)}
.tbl td{padding:6px 10px;border:1px solid var(--line);vertical-align:top}
.tbl td.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.tbl tr.tot td{font-weight:700;background:#faf7f0}
/* T-accounts */
.tgrid{display:flex;flex-wrap:wrap;gap:14px;align-items:flex-start}
.tacc{min-width:260px;flex:1 1 260px;max-width:420px;font-size:14px}
.tacc.small{min-width:200px;flex-basis:200px}
.tacc-name{text-align:center;font-weight:700;border-bottom:2px solid var(--ink);padding-bottom:3px}
.tacc-body{display:flex}.tacc-side{flex:1;padding:2px 6px}.tacc-side:first-child{border-right:2px solid var(--ink)}
.tacc-lab{font-size:11px;font-weight:700;color:var(--muted)}.tacc-side:first-child .tacc-lab{color:var(--dr)}.tacc-side:last-child .tacc-lab{color:var(--cr);text-align:right}
.tacc-row{display:flex;justify-content:space-between;gap:6px;min-height:22px}
.tacc-row b{font-weight:600;font-variant-numeric:tabular-nums}
.tacc-row.tot{border-top:1px solid var(--ink);border-bottom:3px double var(--ink);font-weight:700}
.tacc-row.bd{color:var(--accent)}.tacc-row.cd{color:var(--accent2)}
/* statements */
.stmt{background:#fff;border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin:14px 0;overflow-x:auto}
.stmt-t{font-weight:700;text-align:center;margin-bottom:8px;font-family:Georgia,serif}
.stmt table{width:100%;border-collapse:collapse;font-size:14.5px}
.stmt td{padding:3px 6px}.stmt td.n{text-align:right;width:110px;font-variant-numeric:tabular-nums;white-space:nowrap}
.stmt tr.sub td{font-weight:700;border-top:1px solid #999}
.stmt tr.tot td{font-weight:800;border-top:1px solid var(--ink);border-bottom:3px double var(--ink)}
.stmt tr.hd td{font-weight:700;padding-top:10px;color:var(--accent)}
.stmt tr.in td:first-child{padding-left:20px}
/* worked examples */
.example{border:2px solid var(--accent);border-radius:12px;margin:20px 0;background:#fff;overflow:hidden}
.ex-h{background:var(--accent);color:#fff;padding:8px 14px;font-weight:700}
.ex-q{padding:12px 16px;border-bottom:1px solid var(--line);background:#f8fbfa}
.ex-step{display:flex;gap:12px;padding:12px 16px;border-bottom:1px dashed var(--line)}
.ex-step.hidden{display:none}
.ex-n{flex:0 0 28px;height:28px;border-radius:50%;background:var(--soft);color:var(--accent);font-weight:800;display:flex;align-items:center;justify-content:center}
.ex-c{flex:1;min-width:0}
.ex-btns{padding:12px 16px;display:flex;gap:8px;flex-wrap:wrap}
/* questions */
.q{background:var(--card);border:1px solid var(--line);border-left:4px solid var(--accent2);border-radius:10px;padding:14px 16px;margin:16px 0}
.q.flash,.ak.flash{animation:fl 1.6s}@keyframes fl{0%{box-shadow:0 0 0 6px #f6c85f}100%{box-shadow:0 0 0 0 transparent}}
.q-t{margin-bottom:10px}
.opts{display:flex;flex-direction:column;gap:6px}
.opt{display:flex;gap:10px;align-items:flex-start;text-align:left;border:1px solid var(--line);background:#fcfbf8;border-radius:8px;padding:8px 10px;cursor:pointer;font:inherit;color:inherit}
.opt:hover{border-color:#bbb}.opt .ol{font-weight:800;color:var(--muted);min-width:16px}
.opt.sel{border-color:var(--accent);background:var(--soft)}
.opt.ok{border-color:var(--ok);background:#e8f6ee}.opt.bad{border-color:var(--bad);background:#fbeceb}
.q-act{margin-top:10px}
.q-res{margin-top:8px;font-weight:600}.q-res.ok{color:var(--ok)}.q-res.bad{color:var(--bad)}
.q-res a{font-weight:500;margin-left:6px;color:var(--accent)}
.nparts{display:flex;flex-direction:column;gap:6px}
.npart{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:5px 8px;border-radius:8px;border:1px solid transparent}
.npart span{flex:1}.npart input,.jrow input{width:150px;padding:6px 8px;border:1px solid #c9c2b4;border-radius:6px;font:inherit;text-align:right}
.npart.ok,.jrow.ok{border-color:var(--ok);background:#e8f6ee}.npart.bad,.jrow.bad{border-color:var(--bad);background:#fbeceb}
.jgrid{display:flex;flex-direction:column;gap:6px;max-width:520px}
.jrow{display:flex;align-items:center;gap:10px;padding:5px 8px;border-radius:8px;border:1px solid transparent}
.jrow .jl{font-weight:800;width:26px}.jrow:nth-child(1) .jl{color:var(--dr)}.jrow:nth-child(2) .jl{color:var(--cr);padding-left:10px}
.jrow select{flex:1;padding:6px;border:1px solid #c9c2b4;border-radius:6px;font:inherit;background:#fff}
.btn{background:var(--accent);color:#fff;border:0;border-radius:8px;padding:8px 14px;font:inherit;font-weight:600;cursor:pointer}
.btn.ghost{background:#fff;color:var(--accent);border:1px solid var(--accent)}
/* answer key */
.ak-ch{color:var(--accent2)}
.ak{display:flex;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.ak-n{flex:0 0 64px;font-weight:800;color:var(--accent2)}
.ak-b{flex:1;min-width:0}.ak-q{font-size:13px;color:var(--muted)}.ak-a{margin:3px 0}.ak-ex{font-size:14.5px;background:#fff;border:1px solid var(--line);border-radius:8px;padding:8px 12px;margin-top:4px;overflow-x:auto}
.ak-back{font-size:13px;color:var(--accent)}
/* cover */
/* diagram helpers */
.flow{display:flex;flex-wrap:wrap;gap:8px;align-items:stretch}
.flow .st{flex:1 1 120px;background:var(--soft);border:1px solid #bcd9cf;border-radius:10px;padding:10px;text-align:center;font-size:14px;position:relative}
.flow .st b{display:block;font-size:20px;color:var(--accent);font-family:Georgia,serif}
.ladder{display:flex;flex-direction:column;gap:4px;max-width:560px;margin:auto}
.ladder .r{display:flex;justify-content:space-between;padding:7px 12px;border-radius:8px;background:#f6f3ec;font-size:14.5px}
.ladder .r.res{background:var(--accent);color:#fff;font-weight:700}
.ladder .r.minus{background:#fdf0ec}.ladder .r.plus{background:#eef5f2}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:620px){.two{grid-template-columns:1fr}}
.pill{display:inline-block;border-radius:999px;padding:1px 9px;font-size:13px;font-weight:700}
.pill.dr{background:#e3eef9;color:var(--dr)}.pill.cr{background:#f9e6e2;color:var(--cr)}
.mono{font-variant-numeric:tabular-nums}
.small{font-size:13.5px;color:var(--muted)}

/* ---- shell: one slim top bar + slide-out contents ---- */
#top{display:flex;position:fixed;top:0;left:0;right:0;height:56px;background:#f3eee3;border-bottom:1px solid var(--line);align-items:center;gap:10px;padding:0 12px;z-index:30}
.menu-b{font-size:22px;background:none;border:0;cursor:pointer;padding:4px 8px;border-radius:8px}.menu-b:hover{background:#e7e0d1}
#top .brand{flex:1;min-width:0;font-weight:700;font-size:16px;color:var(--accent);text-decoration:none;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lsw{display:flex;flex:none}.lsw button{border:1px solid var(--line);background:#fff;padding:5px 10px;font:inherit;font-size:13px;font-weight:700;cursor:pointer;color:var(--ink)}
.lsw button:first-child{border-radius:8px 0 0 8px}.lsw button:last-child{border-radius:0 8px 8px 0}
.lsw button.on{background:var(--accent);color:#fff;border-color:var(--accent)}
#side{position:fixed;top:0;left:0;bottom:0;width:300px;max-width:86vw;background:#f7f3ea;border-right:1px solid var(--line);overflow-y:auto;z-index:50;transform:translateX(-100%);transition:transform .2s}
body.menu #side{transform:none}
#scrim{display:none;position:fixed;inset:0;background:rgba(0,0,0,.3);z-index:40}body.menu #scrim{display:block}
.side-top{display:flex;align-items:center;justify-content:space-between;padding:16px 14px 10px;border-bottom:1px solid var(--line)}
.side-top .brand{font-size:17px;color:var(--accent)}.side-top .x{background:none;border:0;font-size:18px;cursor:pointer}
nav{padding:8px 0}
nav a{display:flex;justify-content:space-between;gap:8px;padding:10px 16px;color:var(--ink);text-decoration:none;font-size:15px;border-left:3px solid transparent}
nav a:hover{background:#ece5d7}nav a.on{background:#fff;border-left-color:var(--accent);font-weight:600}
nav a .np{color:var(--ok);font-weight:800}
nav a.nav-ans{margin-top:6px;border-top:1px dashed var(--line);padding-top:14px;color:var(--accent2);font-weight:600}
.reset{font-size:13px;padding:0 16px}.reset a{color:var(--muted)}
#main{max-width:780px;margin:0 auto;padding:80px 20px 90px}
@media(max-width:560px){#main{padding:72px 16px 80px}.lsw button{padding:5px 8px;font-size:12px}}
/* ---- page head, tabs, lesson steps ---- */
.page-h{margin-bottom:14px}
.kicker{text-transform:uppercase;letter-spacing:.08em;font-size:12px;color:var(--accent2);font-weight:700}
h1{font-size:30px;line-height:1.2;margin:6px 0 4px}
h2{font-size:24px;margin:30px 0 10px;padding-top:6px;border-top:1px solid var(--line)}
.seg>h2:first-child,.seg>.box:first-child+h2{border-top:0;margin-top:6px}
.lead{font-size:17px;color:#3b4148}
.tabs{display:flex;gap:8px;position:sticky;top:56px;z-index:20;background:var(--paper);padding:10px 0;border-bottom:1px solid var(--line);margin-bottom:6px}
.tabs button{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;gap:1px;border:1px solid var(--line);background:#fff;border-radius:12px;padding:8px 6px;font:inherit;font-weight:700;cursor:pointer;color:var(--ink)}
.tabs button small{font-weight:500;font-size:12px;color:var(--muted)}
.tabs button.on{background:var(--accent);border-color:var(--accent);color:#fff}.tabs button.on small{color:#cfe7e0}
.tabs button.done:not(.on){border-color:var(--ok)}.tabs button.done small{color:var(--ok)}
.steps{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin:12px 0 4px}
.steps-l{font-size:13px;color:var(--muted);font-weight:600;margin-right:4px}
.steps button{width:32px;height:32px;border-radius:50%;border:1px solid var(--line);background:#fff;font:inherit;font-size:14px;font-weight:700;cursor:pointer;color:var(--muted)}
.steps button.past{background:var(--soft);color:var(--accent);border-color:#bcd9cf}
.steps button.on{background:var(--accent);color:#fff;border-color:var(--accent)}
.secnav{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:36px;padding-top:18px;border-top:1px solid var(--line);flex-wrap:wrap}
.btn.big{padding:12px 18px;font-size:16px;border-radius:10px}
.secnav .btn.big:last-child{margin-left:auto;max-width:100%}
.q-h{display:flex;justify-content:space-between;gap:8px;font-size:12px;margin-bottom:6px}
.q-num{font-weight:800;color:var(--accent2);text-transform:uppercase;letter-spacing:.05em}.q-src{display:none}
/* ---- home ---- */
.cover{background:linear-gradient(135deg,#0f6b5c,#164a42);color:#fff;border-radius:16px;padding:26px 24px;margin-bottom:16px}
.cover h1{font-size:34px;margin:6px 0}.cover .lead{color:#dcefe9;margin:4px 0 16px}.cover-k{font-size:12px;letter-spacing:.08em;text-transform:uppercase;opacity:.8}
.cta{background:#fff;color:var(--accent);border:0;border-radius:12px;padding:13px 18px;font:inherit;font-size:17px;font-weight:700;cursor:pointer;max-width:100%;text-align:left}
.cta:hover{background:#f6c85f;color:#1f2328}
.bigprog{display:flex;align-items:center;gap:10px;font-size:13px;margin-top:16px;color:#fff}
.cover .bar{background:rgba(255,255,255,.25)}.cover .bar i{background:#f6c85f}
.howto{background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px 16px}
.howto summary{cursor:pointer;font-weight:700;color:var(--accent)}.howto ol{margin:10px 0 2px;padding-left:22px}.howto li{margin:6px 0}
.toc{display:flex;flex-direction:column;gap:8px;margin-top:14px}
.toc-i{display:flex;align-items:center;gap:14px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px 14px;text-decoration:none;color:inherit}
.toc-i:hover{border-color:var(--accent)}
.toc-n{flex:0 0 38px;height:38px;border-radius:10px;background:var(--soft);color:var(--accent);font-weight:800;font-size:18px;display:flex;align-items:center;justify-content:center;font-family:Georgia,serif}
.toc-t{flex:1;min-width:0}.toc-t b{display:block;font-weight:600}.minibar{display:block;margin-top:6px}.minibar .bar{height:5px;max-width:220px}
.toc-go{font-size:24px;color:var(--muted)}
.toc-i.mockc .toc-n{background:#fdf0ec;color:var(--accent2)}.toc-i.ans .toc-n{background:#fff8e5;color:#9a7b14}
/* ---- answer key folds ---- */
.akg{background:#fff;border:1px solid var(--line);border-radius:12px;margin:8px 0;padding:0 14px}
.akg summary{cursor:pointer;display:flex;justify-content:space-between;gap:10px;padding:12px 0;font-weight:700}.akg summary small{color:var(--muted);font-weight:500;white-space:nowrap}
.akg[open] summary{border-bottom:1px solid var(--line)}
@media print{#side,#top,#scrim,.tabs,.steps,.secnav,.q-act,.ex-btns{display:none}#main{margin:0;padding:0}.ex-step.hidden{display:flex}}

@media(max-width:560px){
.tbl.cards thead{display:none}.tbl.cards,.tbl.cards tbody,.tbl.cards tr,.tbl.cards td{display:block;width:100%}
.tbl.cards{background:none}.tbl.cards tr{background:#fff;border:1px solid var(--line);border-radius:10px;margin-bottom:8px;padding:6px 0}
.tbl.cards td{border:0;padding:3px 12px;text-align:left!important;white-space:normal!important}
.tbl.cards td:first-child{font-weight:700;color:var(--accent)}
.tbl.cards td:not(:first-child)[data-l]:not([data-l=""])::before{content:attr(data-l) ": ";font-weight:600;color:var(--muted);font-size:13px}
.tabs button{font-size:14px}.tabs{gap:6px}}

.flow .fbox{flex:1 1 130px;background:var(--soft);border:1px solid #bcd9cf;border-radius:10px;padding:10px;text-align:center;font-size:14px}
.flow .fbox b{color:var(--accent);font-size:16px}.flow .fbox small{color:#3b4148}
.flow .farr{align-self:center;font-size:22px;font-weight:800;color:var(--accent2)}
ol.duties{counter-reset:d;list-style:none;padding:0;margin:0;display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:8px}
ol.duties li{counter-increment:d;background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px 12px 10px 46px;position:relative}
ol.duties li::before{content:counter(d);position:absolute;left:10px;top:8px;width:26px;height:26px;border-radius:50%;background:var(--accent);color:#fff;font-weight:800;display:flex;align-items:center;justify-content:center;font-size:14px}

.small-t{font-size:14px}.small-t tr.hl td{background:#fdf0ec}
@media(max-width:560px){.jt-t thead{display:none}.jt-t,.jt-t tbody{display:block}
.jt-t tr{display:flex;flex-wrap:wrap;align-items:baseline;gap:2px 10px;padding:8px 10px;border-bottom:1px solid var(--line)}
.jt-t td{border:0!important;padding:0!important;background:none!important}.jt-t td:nth-last-child(3){flex:1 1 60%}.jt-t td:nth-last-child(2){margin-left:auto;font-weight:700}
.jt-t td:last-child{flex-basis:100%;color:var(--muted)}}

/* UPgrade Council branding: "UP" orange, "grade" blue, heavy wide type */
.upmark{font-family:"Arial Black","Segoe UI Black","Helvetica Neue",Arial,sans-serif;font-weight:900;letter-spacing:.01em;white-space:nowrap}
.upmark .up{color:#F04D24}.upmark .gr{color:#1F4FD8}
.uc{font-family:"Arial Black","Segoe UI Black",Arial,sans-serif;font-weight:900;color:#1F4FD8;letter-spacing:.04em;font-size:.8em;text-transform:uppercase}
.cover-top{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:6px}
.upbadge{display:inline-flex;align-items:baseline;gap:6px;background:#fff;border-radius:999px;padding:5px 14px;font-size:17px;box-shadow:0 2px 8px rgba(0,0,0,.15)}
.cover-by{margin-top:14px;font-size:14px;color:#dcefe9;border-top:1px solid rgba(255,255,255,.2);padding-top:10px}.cover-by b{color:#fff}
.upfoot{margin-top:48px;padding:18px 0 6px;border-top:1px solid var(--line);text-align:center;font-size:14px;color:var(--muted)}
.upfoot .upmark{font-size:17px}.upfoot small{display:block;margin-top:4px;font-size:12px}
.side-up{margin:10px 16px 4px;padding:12px;background:#fff;border:1px solid var(--line);border-radius:10px;font-size:12px;color:var(--muted);text-align:center}
.side-up .upmark{font-size:20px}
@media print{.upfoot{display:block}}
/* --- stronger UPgrade presence --- */
.topup{display:inline-flex;align-items:baseline;gap:4px;background:#fff;border:1px solid var(--line);border-radius:999px;padding:4px 12px;font-size:15px;flex:none}
.topup .uc{font-size:10px}
@media(max-width:560px){.topup .uc{display:none}.topup{padding:3px 9px;font-size:14px}#top .brand{font-size:14px}}
.upchip{display:inline-flex;align-items:baseline;gap:4px;font-size:13px;background:#fff;border:1px solid #dfe5f7;border-left:4px solid #F04D24;border-radius:8px;padding:3px 10px;margin-bottom:8px}
.upchip .uc{font-size:9px}
.cover-brand{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;background:#fff;border-radius:14px;padding:12px 18px;margin:-6px -4px 16px;box-shadow:0 4px 14px rgba(0,0,0,.18)}
.cover-brand .cb-l{display:flex;align-items:baseline;gap:8px;font-size:clamp(30px,7vw,46px);line-height:1}
.cover-brand .cb-l .uc{font-size:.42em}
.cover-brand .cb-r{font-size:13px;text-transform:uppercase;letter-spacing:.12em;color:#F04D24;font-weight:800}
.upfoot{margin-top:56px;padding:26px 16px 14px;border:1px solid var(--line);border-radius:16px;background:#fff;text-align:center;color:var(--muted)}
.upfoot .uf-by{font-size:12px;text-transform:uppercase;letter-spacing:.12em}
.upfoot .uf-logo{display:inline-flex;align-items:baseline;gap:8px;font-size:34px;margin:4px 0 2px;line-height:1.1}
.upfoot .uf-logo .uc{font-size:.4em}
.upfoot small{display:block;margin-top:6px;font-size:12px}

.b1{width:340px;height:340px;background:#F04D24;left:-80px;top:-60px}.b2{width:420px;height:420px;background:#1F4FD8;right:-120px;bottom:-140px;animation-delay:-2s}.b3{width:260px;height:260px;background:#0f6b5c;left:55%;top:8%;opacity:.25;animation-delay:-4s}
@keyframes blob{to{transform:translate(40px,30px) scale(1.15)}}
.sp-in{position:relative;text-align:center}
.sp-logo{font-family:"Arial Black","Segoe UI Black",Arial,sans-serif;font-weight:900;font-size:clamp(58px,15vw,118px);line-height:1;letter-spacing:.01em}
.sp-logo i{font-style:normal;display:inline-block;opacity:0;transform:translateY(-70px) rotate(-8deg);animation:drop .7s cubic-bezier(.2,1.6,.4,1) forwards;animation-delay:calc(.15s + var(--i) * .08s)}
.sp-logo .up{color:#F04D24}.sp-logo .gr{color:#1F4FD8}
@keyframes drop{to{opacity:1;transform:none}}
.sp-c{font-family:"Arial Black",Arial,sans-serif;font-weight:900;color:#1F4FD8;font-size:clamp(14px,3.6vw,22px);letter-spacing:.55em;margin:8px 0 0 .55em}
.sp-c i{font-style:normal;display:inline-block;opacity:0;animation:fadeUp .45s ease-out forwards;animation-delay:calc(.85s + var(--i) * .05s)}
.sp-line{width:0;height:5px;background:#F04D24;border-radius:3px;margin:18px auto 14px;animation:line .7s 1.15s cubic-bezier(.6,0,.2,1) forwards}
@keyframes line{to{width:190px}}
.sp-p{font-size:12px;letter-spacing:.22em;text-transform:uppercase;color:#888;opacity:0;animation:fadeUp .5s 1.35s forwards}
.sp-book{position:relative;width:64px;height:44px;margin:16px auto 6px;perspective:300px;opacity:0;animation:fadeUp .4s 1.45s forwards}
.sp-book .pg{position:absolute;right:50%;top:0;width:32px;height:44px;background:#fff;border:2px solid #0f6b5c;border-radius:4px 0 0 4px;transform-origin:right center}
.sp-book::after{content:"";position:absolute;left:50%;top:0;width:32px;height:44px;background:#e6f2ee;border:2px solid #0f6b5c;border-radius:0 4px 4px 0;box-sizing:border-box}
.sp-book .pg{box-sizing:border-box;animation:flip .55s ease-in-out forwards}.sp-book .p1{animation-delay:1.6s}.sp-book .p2{animation-delay:1.75s}.sp-book .p3{animation-delay:1.9s}
@keyframes flip{to{transform:rotateY(-180deg)}}
.sp-t{font-family:Georgia,serif;font-size:24px;font-weight:700;color:#0f6b5c;opacity:0;animation:fadeUp .6s 1.7s forwards}.sp-t span{font-size:16px;color:#555;font-weight:400}
.sp-skip{margin-top:18px;font-size:11px;color:#aaa;letter-spacing:.08em;opacity:0;animation:fadeUp .5s 2s forwards}
@keyframes fadeUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
/* ===== chapter intro overlay ===== */
#chintro{position:fixed;inset:0;z-index:90;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#0f6b5c,#123f38);color:#fff;cursor:pointer;overflow:hidden;clip-path:circle(0% at 50% 50%);animation:ciOpen .55s cubic-bezier(.7,0,.3,1) forwards}
#chintro.out{animation:ciClose .5s cubic-bezier(.7,0,.3,1) forwards}
@keyframes ciOpen{to{clip-path:circle(150% at 50% 50%)}}
@keyframes ciClose{from{clip-path:circle(150% at 50% 50%)}to{clip-path:circle(150% at 50% -60%);opacity:.2}}
.ci-stripes{position:absolute;inset:0}.ci-stripes i{position:absolute;left:-20%;width:140%;height:70px;transform:rotate(-12deg) translateX(-110%);animation:stripe .9s cubic-bezier(.6,0,.2,1) forwards}
.ci-stripes i:nth-child(1){top:12%;background:rgba(240,77,36,.9);animation-delay:.15s}.ci-stripes i:nth-child(2){top:20%;background:rgba(31,79,216,.85);height:22px;animation-delay:.25s}.ci-stripes i:nth-child(3){bottom:14%;background:rgba(246,200,95,.35);height:40px;animation-delay:.35s}
@keyframes stripe{to{transform:rotate(-12deg) translateX(0)}}
.ci-in{position:relative;text-align:center;padding:0 24px;max-width:820px}
.ci-num{font-family:Georgia,serif;font-weight:700;font-size:clamp(90px,22vw,170px);line-height:1;color:#f6c85f;opacity:0;transform:scale(.3) rotate(-10deg);animation:pop .6s .3s cubic-bezier(.2,1.5,.4,1) forwards;text-shadow:0 8px 30px rgba(0,0,0,.3)}
@keyframes pop{to{opacity:1;transform:none}}
.ci-k{text-transform:uppercase;letter-spacing:.2em;font-size:13px;font-weight:700;color:#cfe7e0;opacity:0;animation:fadeUp .45s .55s forwards}
.ci-t{font-family:Georgia,serif;font-size:clamp(24px,5vw,40px);font-weight:700;line-height:1.2;margin-top:10px}
.ci-w{display:inline-block;opacity:0;transform:translateY(24px);animation:fadeUp .5s forwards;animation-delay:calc(.65s + var(--i) * .06s)}
.ci-s{margin-top:12px;font-size:14px;color:#cfe7e0;opacity:0;animation:fadeUp .45s 1s forwards}
.ci-up{display:inline-flex;align-items:baseline;gap:6px;margin-top:22px;background:#fff;border-radius:999px;padding:5px 14px;font-size:16px;opacity:0;animation:fadeUp .45s 1.05s forwards}.ci-up .uc{font-size:10px}
/* ===== page content entrance ===== */
#main.anim>*{animation:enter .55s cubic-bezier(.2,.8,.3,1) both}
#main.anim>*:nth-child(1){animation-delay:.02s}#main.anim>*:nth-child(2){animation-delay:.08s}#main.anim>*:nth-child(3){animation-delay:.14s}#main.anim>*:nth-child(4){animation-delay:.2s}#main.anim>*:nth-child(5){animation-delay:.26s}#main.anim>*:nth-child(n+6){animation-delay:.32s}
#main.anim .seg>*{animation:enter .5s cubic-bezier(.2,.8,.3,1) both}
#main.anim .seg>*:nth-child(1){animation-delay:.18s}#main.anim .seg>*:nth-child(2){animation-delay:.24s}#main.anim .seg>*:nth-child(3){animation-delay:.3s}#main.anim .seg>*:nth-child(4){animation-delay:.36s}#main.anim .seg>*:nth-child(n+5){animation-delay:.42s}
#main.anim .toc-i{animation:enter .5s cubic-bezier(.2,.8,.3,1) both}
#main.anim .toc-i:nth-child(1){animation-delay:.15s}#main.anim .toc-i:nth-child(2){animation-delay:.2s}#main.anim .toc-i:nth-child(3){animation-delay:.25s}#main.anim .toc-i:nth-child(4){animation-delay:.3s}#main.anim .toc-i:nth-child(5){animation-delay:.35s}#main.anim .toc-i:nth-child(6){animation-delay:.4s}#main.anim .toc-i:nth-child(7){animation-delay:.45s}#main.anim .toc-i:nth-child(8){animation-delay:.5s}#main.anim .toc-i:nth-child(n+9){animation-delay:.55s}
@keyframes enter{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
.toc-i,.cta,.tabs button,.btn{transition:transform .15s,box-shadow .15s}

<body><div id="top"><button onclick="toggleMenu()" aria-label="menu">☰</button><span id="mtitle"></span></div>
<aside id="side"></aside><main id="main"></main>
<div id="splash" onclick="hideSplash()"><div class="sp-bg"><span class="sp-photo"></span><span class="sp-veil"></span><span class="blob b1"></span><span class="blob b2"></span><span class="blob b3"></span></div><div class="sp-in"><div class="sp-logo"><i class="up" style="--i:0">U</i><i class="up" style="--i:1">P</i><i class="gr" style="--i:2">g</i><i class="gr" style="--i:3">r</i><i class="gr" style="--i:4">a</i><i class="gr" style="--i:5">d</i><i class="gr" style="--i:6">e</i></div><div class="sp-c"><i style="--i:0">C</i><i style="--i:1">O</i><i style="--i:2">U</i><i style="--i:3">N</i><i style="--i:4">C</i><i style="--i:5">I</i><i style="--i:6">L</i></div><div class="sp-line"></div><div class="sp-p">presents · taqdim etadi</div><div class="sp-book"><span class="pg p1"></span><span class="pg p2"></span><span class="pg p3"></span></div><div class="sp-t">Accounting Workbook<br><span>Buxgalteriya kitobi</span></div><div class="sp-skip">tap to skip · o‘tkazish uchun bosing</div></div></div>
<script>
/* ===== Workbook engine ===== */
const BOOK = { chapters: [], mock: null };
let LANG = 'uz';
let PAGE = 'home';
let STORE = { ans: {}, res: {}, lang: 'uz', page: 'home' };

function load() {
  try { const s = localStorage.getItem('acc-workbook-v1'); if (s) STORE = Object.assign(STORE, JSON.parse(s)); } catch (e) {}
  LANG = STORE.lang || 'uz'; PAGE = STORE.page || 'home';
}
function save() {
  STORE.lang = LANG; STORE.page = PAGE;
  try { localStorage.setItem('acc-workbook-v1', JSON.stringify(STORE)); } catch (e) {}
}
const L = x => (x == null ? '' : typeof x === 'string' || typeof x === 'number' ? String(x) : (x[LANG] != null ? x[LANG] : x.en));
const UI = {
  check: { en: 'Check', uz: 'Tekshirish' },
  retry: { en: 'Try again', uz: 'Qayta urinish' },
  correct: { en: 'Correct!', uz: "To'g'ri!" },
  wrong: { en: 'Not quite.', uz: "Noto'g'ri." },
  seeBack: { en: 'Full answer and working at the back →', uz: "To'liq javob va yechim kitob oxirida →" },
  next: { en: 'Show next step', uz: 'Keyingi qadamni ko‘rsatish' },
  all: { en: 'Show all steps', uz: 'Barcha qadamlar' },
  home: { en: 'Start', uz: 'Boshlanish' },
  answers: { en: 'Answer key (at the back)', uz: 'Javoblar (kitob oxiri)' },
  mock: { en: 'Mock exam', uz: 'Namunaviy imtihon' },
  prev: { en: '← Previous', uz: '← Oldingi' },
  nextCh: { en: 'Next →', uz: 'Keyingi →' },
  part: { en: 'Part 2 · English', uz: '1-qism · O‘zbekcha' },
  dr: { en: 'Debit', uz: 'Debet' }, cr: { en: 'Credit', uz: 'Kredit' },
  choose: { en: '— choose account —', uz: '— hisobni tanlang —' },
  amount: { en: 'amount', uz: 'summa' },
  q: { en: 'Question', uz: 'Savol' },
  score: { en: 'Score', uz: 'Natija' },
  reset: { en: 'Reset my answers', uz: 'Javoblarimni tozalash' },
  progress: { en: 'solved', uz: 'yechildi' },
  goQ: { en: '← back to the question', uz: '← savolga qaytish' },
};

/* ---------- helpers for figures ---------- */
function fmt(n) { if (typeof n !== 'number') return n; const s = Math.abs(n).toLocaleString('en-US', { maximumFractionDigits: 2 }); return n < 0 ? '(' + s + ')' : s; }
function tacc(name, dr, cr, opts = {}) {
  const rows = Math.max(dr.length, cr.length);
  let h = `<div class="tacc${opts.small ? ' small' : ''}"><div class="tacc-name">${L(name)}</div><div class="tacc-body"><div class="tacc-side"><div class="tacc-lab">Dr</div>`;
  for (let i = 0; i < rows; i++) { const r = dr[i]; h += `<div class="tacc-row${r && r[2] ? ' ' + r[2] : ''}">${r ? `<span>${L(r[0])}</span><b>${fmt(r[1])}</b>` : '&nbsp;'}</div>`; }
  h += `</div><div class="tacc-side"><div class="tacc-lab">Cr</div>`;
  for (let i = 0; i < rows; i++) { const r = cr[i]; h += `<div class="tacc-row${r && r[2] ? ' ' + r[2] : ''}">${r ? `<span>${L(r[0])}</span><b>${fmt(r[1])}</b>` : '&nbsp;'}</div>`; }
  return h + '</div></div></div>';
}
function stmt(title, lines) {
  // lines: [label, col1, col2, cls]
  let h = `<div class="stmt"><div class="stmt-t">${L(title)}</div><table>`;
  for (const ln of lines) {
    const [lab, a, b, cls] = ln;
    h += `<tr class="${cls || ''}"><td>${L(lab)}</td><td class="n">${a === '' || a == null ? '' : fmt(a)}</td><td class="n">${b === '' || b == null ? '' : fmt(b)}</td></tr>`;
  }
  return h + '</table></div>';
}

/* ---------- question registry ---------- */
let QNUM = {};
function numberQuestions() {
  QNUM = {};
  BOOK.chapters.forEach((ch, ci) => { let n = 0; walkBlocks(ch.blocks, b => { if (isQ(b)) { n++; QNUM[b.id] = `${ci + 1}.${n}`; b._ch = ch.id; } }); });
  if (BOOK.mock) { let n = 0; walkBlocks(BOOK.mock.blocks, b => { if (isQ(b)) { n++; QNUM[b.id] = b.label || `M${n}`; b._ch = 'mock'; } }); }
}
const isQ = b => ['mcq', 'num', 'journal'].includes(b.t);
function walkBlocks(blocks, fn) { (blocks || []).forEach(b => { fn(b); if (b.blocks) walkBlocks(b.blocks, fn); }); }

/* ---------- block renderers ---------- */
function renderBlock(b) {
  switch (b.t) {
    case 'h': return `<h2 id="${b.id || ''}">${L(b)}</h2>`;
    case 'h3': return `<h3>${L(b)}</h3>`;
    case 'p': return `<p>${L(b)}</p>`;
    case 'ul': return `<ul>${(b.items || []).map(i => `<li>${L(i)}</li>`).join('')}</ul>`;
    case 'box': return `<div class="box ${b.kind || 'rule'}"><div class="box-h">${L(BOXT[b.kind || 'rule'])}</div>${L(b)}</div>`;
    case 'html': return typeof b.html === 'function' ? b.html() : L(b.html);
    case 'fig': return `<figure class="fig">${typeof b.html === 'function' ? b.html() : L(b.html)}${b.cap ? `<figcaption>${L(b.cap)}</figcaption>` : ''}</figure>`;
    case 'table': return renderTable(b);
    case 'example': return renderExample(b);
    case 'section': return `<section class="sec">${b.title ? `<h2>${L(b.title)}</h2>` : ''}${b.blocks.map(renderBlock).join('')}</section>`;
    case 'mcq': return renderMCQ(b);
    case 'num': return renderNum(b);
    case 'journal': return renderJournal(b);
    default: return '';
  }
}
const BOXT = {
  rule: { en: '📌 Rule', uz: '📌 Qoida' }, trap: { en: '⚠️ Exam trap', uz: '⚠️ Imtihon tuzog‘i' },
  tip: { en: '💡 Tip', uz: '💡 Maslahat' }, uz: { en: '🗣 In simple words', uz: '🗣 Oddiy qilib aytganda' },
  key: { en: '🔑 Remember', uz: '🔑 Yodda tuting' }, note: { en: '📝 Note about your lecturer', uz: '📝 O‘qituvchingiz haqida eslatma' },
};
function renderTable(b) {
  const cards = b.head && b.head.length >= 4;
  const hl = i => (b.head && b.head[i] ? stripTags(L(b.head[i])).replace(/"/g, '') : '');
  let h = `<div class="tblwrap">${b.cap ? `<div class="tcap">${L(b.cap)}</div>` : ''}<table class="tbl${cards ? ' cards' : ''}">`;
  if (b.head) h += `<thead><tr>${b.head.map(c => `<th>${L(c)}</th>`).join('')}</tr></thead>`;
  h += `<tbody>${b.rows.map(r => `<tr class="${r.cls || ''}">${(r.cells || r).map((c, i) => `<td class="${typeof c === 'number' ? 'n' : ''}" data-l="${hl(i)}">${typeof c === 'number' ? fmt(c) : L(c)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;
  return h;
}
function renderExample(b) {
  const id = b.id;
  const shown = (STORE.ex && STORE.ex[id]) || 0;
  let h = `<div class="example" id="ex-${id}"><div class="ex-h">✏️ ${L({ en: 'Worked example', uz: 'Ishlangan misol' })}: ${L(b.title)}</div>`;
  if (b.q) h += `<div class="ex-q">${L(b.q)}</div>`;
  b.steps.forEach((s, i) => {
    h += `<div class="ex-step${i < shown ? '' : ' hidden'}"><div class="ex-n">${i + 1}</div><div class="ex-c">${s.title ? `<b>${L(s.title)}</b><br>` : ''}${typeof s.html === 'function' ? s.html() : L(s)}</div></div>`;
  });
  if (shown < b.steps.length) h += `<div class="ex-btns"><button class="btn" onclick="exStep('${id}',1)">${L(UI.next)} (${shown + 1}/${b.steps.length})</button><button class="btn ghost" onclick="exStep('${id}',99)">${L(UI.all)}</button></div>`;
  return h + '</div>';
}
function exStep(id, n) { STORE.ex = STORE.ex || {}; STORE.ex[id] = (STORE.ex[id] || 0) + n; save(); rerenderKeepScroll(); }

function qHead(b) { return `<div class="q-h"><span class="q-num">${L(UI.q)} ${QNUM[b.id]}</span>${b.src ? `<span class="q-src">${L(b.src)}</span>` : ''}</div>`; }
function resultLine(b) {
  const r = STORE.res[b.id];
  if (r == null) return '';
  return `<div class="q-res ${r ? 'ok' : 'bad'}">${r ? '✅ ' + L(UI.correct) : '❌ ' + L(UI.wrong)} <a href="#" onclick="gotoAnswer('${b.id}');return false">${L(UI.seeBack)}</a></div>`;
}
function renderMCQ(b) {
  const sel = STORE.ans[b.id]; const r = STORE.res[b.id];
  let h = `<div class="q mcq" id="q-${b.id}">${qHead(b)}<div class="q-t">${L(b.q)}</div><div class="opts">`;
  b.opts.forEach((o, i) => {
    let cls = 'opt';
    if (sel === i) cls += ' sel';
    if (r != null && sel === i) cls += r ? ' ok' : ' bad';
    h += `<button class="${cls}" onclick="pick('${b.id}',${i})"><span class="ol">${'ABCDEFG'[i]}</span><span>${L(o)}</span></button>`;
  });
  h += `</div><div class="q-act"><button class="btn" onclick="checkQ('${b.id}')">${L(UI.check)}</button></div>${resultLine(b)}</div>`;
  return h;
}
function renderNum(b) {
  const vals = STORE.ans[b.id] || {};
  const parts = b.parts || [{ k: 'a', label: '', ans: b.ans }];
  const pr = (STORE.res[b.id + ':parts']) || {};
  let h = `<div class="q num" id="q-${b.id}">${qHead(b)}<div class="q-t">${L(b.q)}</div><div class="nparts">`;
  parts.forEach(p => {
    const st = pr[p.k] == null ? '' : pr[p.k] ? ' ok' : ' bad';
    h += `<label class="npart${st}"><span>${L(p.label)}</span><input inputmode="decimal" data-q="${b.id}" data-k="${p.k}" value="${vals[p.k] != null ? vals[p.k] : ''}" onchange="numIn(this)" placeholder="0"></label>`;
  });
  h += `</div><div class="q-act"><button class="btn" onclick="checkQ('${b.id}')">${L(UI.check)}</button></div>${resultLine(b)}</div>`;
  return h;
}
function renderJournal(b) {
  const v = STORE.ans[b.id] || {};
  const pr = (STORE.res[b.id + ':parts']) || {};
  const accts = b.accounts;
  const sel = (side) => `<select data-q="${b.id}" data-k="${side}" onchange="jIn(this)"><option value="">${L(UI.choose)}</option>${accts.map((a, i) => `<option value="${i}" ${String(v[side]) === String(i) ? 'selected' : ''}>${L(a)}</option>`).join('')}</select>`;
  const st = k => pr[k] == null ? '' : pr[k] ? ' ok' : ' bad';
  let h = `<div class="q journal" id="q-${b.id}">${qHead(b)}<div class="q-t">${L(b.q)}</div><div class="jgrid">`;
  h += `<div class="jrow${st('dr')}"><span class="jl">Dr</span>${sel('dr')}</div><div class="jrow${st('cr')}"><span class="jl">Cr</span>${sel('cr')}</div>`;
  if (b.amt != null) h += `<div class="jrow${st('amt')}"><span class="jl">$</span><input inputmode="decimal" data-q="${b.id}" data-k="amt" value="${v.amt != null ? v.amt : ''}" onchange="jIn(this)" placeholder="${L(UI.amount)}"></div>`;
  h += `</div><div class="q-act"><button class="btn" onclick="checkQ('${b.id}')">${L(UI.check)}</button></div>${resultLine(b)}</div>`;
  return h;
}
function findQ(id) { let f = null; const all = BOOK.chapters.map(c => c.blocks).concat(BOOK.mock ? [BOOK.mock.blocks] : []); all.forEach(bl => walkBlocks(bl, b => { if (b.id === id) f = b; })); return f; }
function pick(id, i) { STORE.ans[id] = i; delete STORE.res[id]; save(); rerenderKeepScroll(); }
function parseNum(s) { if (s == null) return NaN; s = String(s).replace(/[\s,$]/g, '').replace(/^\((.*)\)$/, '-$1'); return s === '' ? NaN : Number(s); }
function numIn(el) { const id = el.dataset.q; STORE.ans[id] = STORE.ans[id] || {}; STORE.ans[id][el.dataset.k] = el.value; delete STORE.res[id]; save(); }
function jIn(el) { numIn(el); }
function checkQ(id) {
  const b = findQ(id); let ok = false;
  if (b.t === 'mcq') ok = STORE.ans[id] === b.a;
  else if (b.t === 'num') {
    const parts = b.parts || [{ k: 'a', ans: b.ans }]; const v = STORE.ans[id] || {}; const pr = {};
    // read current inputs too
    document.querySelectorAll(`input[data-q="${id}"]`).forEach(el => { v[el.dataset.k] = el.value; });
    STORE.ans[id] = v;
    ok = true;
    parts.forEach(p => { const x = parseNum(v[p.k]); const tol = p.tol != null ? p.tol : (b.tol != null ? b.tol : 1); const good = !isNaN(x) && Math.abs(x - p.ans) <= tol; pr[p.k] = good; if (!good) ok = false; });
    STORE.res[id + ':parts'] = pr;
  } else if (b.t === 'journal') {
    const v = STORE.ans[id] || {}; document.querySelectorAll(`[data-q="${id}"]`).forEach(el => { v[el.dataset.k] = el.value; }); STORE.ans[id] = v;
    const pr = { dr: String(v.dr) === String(b.dr), cr: String(v.cr) === String(b.cr) };
    if (b.amt != null) pr.amt = Math.abs(parseNum(v.amt) - b.amt) <= 0.5;
    STORE.res[id + ':parts'] = pr; ok = Object.values(pr).every(Boolean);
  }
  STORE.res[id] = ok; save(); rerenderKeepScroll();
}

/* ---------- answer key ---------- */
function answerText(b) {
  if (b.t === 'mcq') return `<b>${'ABCDEFG'[b.a]}</b> — ${L(b.opts[b.a])}`;
  if (b.t === 'num') { const parts = b.parts || [{ k: 'a', label: '', ans: b.ans }]; return parts.map(p => `${p.label ? L(p.label) + ': ' : ''}<b>${fmt(p.ans)}</b>`).join('<br>'); }
  if (b.t === 'journal') return `Dr <b>${L(b.accounts[b.dr])}</b> · Cr <b>${L(b.accounts[b.cr])}</b>${b.amt != null ? ` · <b>${fmt(b.amt)}</b>` : ''}`;
  return '';
}
function stripTags(s) { return String(s).replace(/<[^>]+>/g, ' ').replace(/\s+/g, ' ').trim(); }
/* ---------- progress ---------- */
function chProgress(blocks) { let t = 0, ok = 0; walkBlocks(blocks, b => { if (isQ(b)) { t++; if (STORE.res[b.id]) ok++; } }); return { t, ok }; }
const pct = p => (p.t ? Math.round(p.ok / p.t * 100) : 0);
const bar = p => `<div class="bar"><i style="width:${pct(p)}%"></i></div>`;

/* ---------- page model: each chapter = 3 tabs; the lesson tab is read one section at a time ---------- */
const TAB = {
  lesson: { en: '📖 Lesson', uz: '📖 Dars' }, quiz: { en: '✅ Quiz', uz: '✅ Test' }, prac: { en: '✏️ Practice', uz: '✏️ Masalalar' },
};
const MOCKTAB = [{ en: 'Section A · MCQ', uz: 'A bo‘lim · Test' }, { en: 'Section B · Process', uz: 'B bo‘lim · Masalalar' }];
function splitSegs(blocks) {
  const segs = [];
  blocks.forEach(b => { if (b.t === 'h' || !segs.length) segs.push({ head: b.t === 'h' ? b : null, blocks: [] }); segs[segs.length - 1].blocks.push(b); });
  if (segs.length > 1 && !segs[0].head) { segs[1].blocks = segs[0].blocks.concat(segs[1].blocks); segs.shift(); }
  return segs;
}
const MODEL = {};
function pageModel(id) {
  if (MODEL[id]) return MODEL[id];
  let tabs;
  if (id === 'mock') tabs = splitSegs(BOOK.mock.blocks).map((s, i) => ({ key: 's' + i, label: MOCKTAB[i] || s.head, segs: [s], hideHead: true }));
  else {
    const segs = splitSegs(BOOK.chapters.find(c => c.id === id).blocks);
    let qi = segs.findIndex(s => s.head && s.head.en === QUIZ.en); let pi = segs.findIndex(s => s.head && s.head.en === PRACT.en);
    if (qi < 0) qi = segs.length; if (pi < 0) pi = segs.length;
    tabs = [{ key: 'lesson', label: TAB.lesson, segs: segs.slice(0, qi), step: true }];
    if (pi > qi) tabs.push({ key: 'quiz', label: TAB.quiz, segs: segs.slice(qi, pi), hideHead: true });
    if (segs.length > pi) tabs.push({ key: 'prac', label: TAB.prac, segs: segs.slice(pi), hideHead: true });
  }
  return (MODEL[id] = { tabs });
}
const tabBlocks = t => t.segs.flatMap(s => s.blocks);
function getView(id) { STORE.view = STORE.view || {}; return STORE.view[id] || (STORE.view[id] = { tab: 0, sec: 0 }); }
function setTab(id, k) { getView(id).tab = k; ANIM = true; save(); render(); window.scrollTo(0, 0); }
function setSec(id, s) { const v = getView(id); v.tab = 0; v.sec = s; ANIM = true; save(); render(); window.scrollTo(0, 0); }
function nextPageOf(id) { const o = navOrder(); return o[o.indexOf(id) + 1]; }

function renderPage(id) {
  const m = pageModel(id); const v = getView(id);
  const k = Math.min(v.tab || 0, m.tabs.length - 1); const tab = m.tabs[k];
  let h;
  if (id === 'mock') h = `<div class="page-h"><span class="upchip">${upMark()} <span class="uc">Council</span></span><div class="kicker">★ ${L(BOOK.mock.sub)}</div><h1>${L(BOOK.mock.title)}</h1></div>`;
  else { const i = BOOK.chapters.findIndex(c => c.id === id); const ch = BOOK.chapters[i]; h = `<div class="page-h"><span class="upchip">${upMark()} <span class="uc">Council</span></span><div class="kicker">${L({ en: 'Chapter', uz: 'Bob' })} ${i + 1} · ${L(ch.week)}</div><h1>${L(ch.title)}</h1></div>`; }
  // tabs
  h += `<div class="tabs">${m.tabs.map((t, j) => { const p = chProgress(tabBlocks(t)); const badge = t.step ? `${t.segs.length} ${L({ en: 'parts', uz: 'qism' })}` : `${p.ok}/${p.t}`; return `<button class="${j === k ? 'on' : ''}${!t.step && p.t && p.ok === p.t ? ' done' : ''}" onclick="setTab('${id}',${j})"><span>${L(t.label)}</span><small>${badge}</small></button>`; }).join('')}</div>`;
  if (tab.step) {
    const n = tab.segs.length; const s = Math.max(0, Math.min(v.sec || 0, n - 1)); const seg = tab.segs[s];
    h += `<div class="steps"><span class="steps-l">${L({ en: 'Part', uz: 'Qism' })} ${s + 1} / ${n}</span>${tab.segs.map((x, j) => `<button class="${j === s ? 'on' : j < s ? 'past' : ''}" title="${stripTags(L(x.head)).replace(/"/g, '')}" onclick="setSec('${id}',${j})">${j + 1}</button>`).join('')}</div>`;
    if (s === 0 && id !== 'mock') { const ch = BOOK.chapters.find(c => c.id === id); if (ch.lead) h += `<p class="lead">${L(ch.lead)}</p>`; }
    h += `<div class="seg">${seg.blocks.map(renderBlock).join('')}</div>`;
    const nextBtn = s < n - 1
      ? `<button class="btn big" onclick="setSec('${id}',${s + 1})">${L({ en: 'Next', uz: 'Keyingi' })}: ${stripTags(L(tab.segs[s + 1].head)).replace(/^\d+\.\d+\s*/, '')} →</button>`
      : (m.tabs[k + 1] ? `<button class="btn big" onclick="setTab('${id}',${k + 1})">${L({ en: 'Lesson done — go to the quiz', uz: 'Dars tugadi — testga o‘tish' })} →</button>` : (nextPageOf(id) ? `<button class="btn big" onclick="go('${nextPageOf(id)}')">${L({ en: 'Next', uz: 'Keyingi' })}: ${pageTitle(nextPageOf(id))} →</button>` : ''));
    h += `<div class="secnav">${s > 0 ? `<button class="btn ghost big" onclick="setSec('${id}',${s - 1})">← ${L({ en: 'Back', uz: 'Orqaga' })}</button>` : '<span></span>'}${nextBtn}</div>`;
  } else {
    if (id === 'mock' && k === 0 && BOOK.mock.lead) h += `<p class="lead">${L(BOOK.mock.lead)}</p>`;
    h += `<div class="seg">${tab.segs.map(sg => sg.blocks.filter(b => !(tab.hideHead && b === sg.head)).map(renderBlock).join('')).join('')}</div>`;
    let nb;
    if (m.tabs[k + 1]) nb = `<button class="btn big" onclick="setTab('${id}',${k + 1})">${L(m.tabs[k + 1].label)} →</button>`;

function hideSplash() {

  const a = { left: Math.min(...ls.map(r => r.left)), top: Math.min(...ls.map(r => r.top)), right: Math.max(...ls.map(r => r.right)), bottom: Math.max(...ls.map(r => r.bottom)) };

  const f = fly.getBoundingClientRect(), b = tgt.getBoundingClientRect(), sc = b.width / f.width;
  const dx = (b.left + b.width / 2) - (f.left + f.width / 2), dy = (b.top + b.height / 2) - (f.top + f.height / 2);
  const anim = fly.animate([
    { transform: 'translate(0,0) scale(1)' },

    { transform: `translate(${dx}px,${dy}px) scale(${sc})` }

  // 3) the cover fades, revealing the home page underneath

/* ===== Chapter 4 — Inventory valuation and adjustments (TW4) ===== */
function layers(rows, takeFrom, take) {
  // rows: [units, price, color]; draws stacked blocks; marks sold units
  let left = take; const order = takeFrom === 'top' ? [...rows.keys()].reverse() : [...rows.keys()];
  const sold = rows.map(() => 0);
  for (const i of order) { const t = Math.min(rows[i][0], left); sold[i] = t; left -= t; }
  return `<div style="display:flex;flex-direction:column-reverse;gap:3px;max-width:340px;margin:auto">${rows.map((r, i) => {
    const keep = r[0] - sold[i];
    return `<div style="display:flex;height:${Math.max(26, r[0] * 1.1)}px;border-radius:6px;overflow:hidden;border:1px solid #bbb">
      ${sold[i] ? `<div style="flex:${sold[i]};background:repeating-linear-gradient(45deg,#f3d9d2,#f3d9d2 6px,#fbeeea 6px,#fbeeea 12px);display:flex;align-items:center;justify-content:center;font-size:12px;color:#b4442f">${sold[i]} ${L(T('sold', 'sotildi'))}</div>` : ''}
      ${keep ? `<div style="flex:${keep};background:${r[2]};display:flex;align-items:center;justify-content:center;font-size:12px;color:#fff;font-weight:700">${keep} @ $${r[1]}</div>` : ''}</div>`;
  }).join('')}</div>`;
}

    H('4.4 Periodic vs perpetual', '4.4 Davriy va doimiy (perpetual) tizim'),

    EX('e4eng', T('Englehart Company — March', 'Englehart kompaniyasi — mart'), T('1 Mar 200 units at €4.00; 10 Mar bought 500 at €4.50; 15 Mar sold 500; 20 Mar bought 400 at €4.75; 25 Mar sold 400; 30 Mar bought 300 at €5.00. 500 units on hand at 31 March.', '1-mart 200 dona €4.00; 10-mart 500 dona €4.50 olindi; 15-mart 500 sotildi; 20-mart 400 dona €4.75; 25-mart 400 sotildi; 30-mart 300 dona €5.00. 31-martda 500 dona qoldi.'), [

function depChart() {
  const sl = [8000, 6125, 4250, 2375, 500], rb = [8000, 4000, 2000, 1000, 500];
  const X = i => 60 + i * 110, Y = v => 200 - v / 8000 * 170;
  const path = a => a.map((v, i) => `${i ? 'L' : 'M'}${X(i)},${Y(v)}`).join(' ');
  const dots = (a, c) => a.map((v, i) => `<circle cx="${X(i)}" cy="${Y(v)}" r="4" fill="${c}"/><text x="${X(i)}" y="${Y(v) - 9}" font-size="11" text-anchor="middle" fill="${c}">${v.toLocaleString('en-US')}</text>`).join('');
  return `<svg viewBox="0 0 560 240" width="100%" style="max-width:560px;display:block;margin:auto" font-family="Segoe UI,Arial">
    <line x1="50" y1="200" x2="530" y2="200" stroke="#999"/><line x1="50" y1="20" x2="50" y2="200" stroke="#999"/>
    ${[0, 1, 2, 3, 4].map(i => `<text x="${X(i)}" y="218" font-size="12" text-anchor="middle" fill="#555">${L(T('Year', 'Yil'))} ${i}</text>`).join('')}
    <path d="${path(sl)}" fill="none" stroke="#2a6fb0" stroke-width="3"/><path d="${path(rb)}" fill="none" stroke="#b4442f" stroke-width="3" stroke-dasharray="6 4"/>
    ${dots(sl, '#2a6fb0')}${dots(rb, '#b4442f')}
    <rect x="330" y="30" width="190" height="46" fill="#fff" stroke="#ddd"/><line x1="340" y1="45" x2="370" y2="45" stroke="#2a6fb0" stroke-width="3"/><text x="378" y="49" font-size="12">${L(T('Straight line', 'To‘g‘ri chiziqli'))}</text>
    <line x1="340" y1="64" x2="370" y2="64" stroke="#b4442f" stroke-width="3" stroke-dasharray="6 4"/><text x="378" y="68" font-size="12">${L(T('Reducing balance 50%', 'Kamayuvchi qoldiq 50%'))}</text></svg>`;
}

    H3('Revaluation and changes in estimates', 'Qayta baholash va baholarni o‘zgartirish'),
    P('<b>Revaluation:</b> a company may revalue property to fair value. The gain goes to a <b>revaluation surplus</b> (equity, shown in other comprehensive income), not to profit. Depreciation is then based on the new value over the remaining life. <i>Example (Ira Vann):</i> building $30,000 over 30 years → $1,000 a year; after 5 years the carrying amount is $25,000; revalued to $75,000 with 25 years left → new charge <b>$3,000 a year</b>.',
      '<b>Qayta baholash:</b> kompaniya mulkni adolatli qiymatga qayta baholashi mumkin. Farq foydaga emas, <b>qayta baholash zaxirasi</b>ga (kapital, boshqa umumiy daromadda) yoziladi. Keyin amortizatsiya yangi qiymatdan qolgan muddatga hisoblanadi. <i>Misol (Ira Vann):</i> bino $30,000, 30 yil → yiliga $1,000; 5 yildan keyin $25,000; $75,000 ga baholandi, 25 yil qoldi → yangi <b>yiliga $3,000</b>.'),
    P('<b>Change in estimate:</b> take the carrying amount at the date of change and spread it (less the new residual) over the remaining life. <i>Example:</i> oven $30,000 over 20 years ($1,500 a year); after 3 years CA = 25,500; new estimate 12 more years, residual $1,500 → (25,500 − 1,500) ÷ 12 = <b>$2,000 a year</b>.',
      '<b>Bahoni o‘zgartirish:</b> o‘zgarish sanasidagi balans qiymatini (yangi qoldiqni ayirib) qolgan muddatga taqsimlang. <i>Misol:</i> pech $30,000, 20 yil (yiliga $1,500); 3 yildan keyin 25,500; yana 12 yil, qoldiq $1,500 → (25,500 − 1,500) ÷ 12 = <b>yiliga $2,000</b>.'),

/* ===== Chapter 6 — Accruals and prepayments (TW6) ===== */
function timeline(startIdx, len, yearEndIdx, color, labThis, labNext) {
  const M = ['J', 'F', 'M', 'A', 'M', 'J', 'J', 'A', 'S', 'O', 'N', 'D', 'J', 'F', 'M', 'A', 'M', 'J', 'J', 'A', 'S'];
  const w = 26;
  let s = `<svg viewBox="0 0 ${M.length * w + 20} 96" width="100%" style="max-width:600px;display:block;margin:auto" font-family="Segoe UI,Arial">`;
  M.forEach((m, i) => { const inside = i >= startIdx && i < startIdx + len; const thisYear = i <= yearEndIdx;
    s += `<rect x="${10 + i * w}" y="30" width="${w - 2}" height="24" rx="3" fill="${inside ? (thisYear ? color : '#cfd8dc') : '#f2efe8'}" stroke="#ddd"/><text x="${10 + i * w + w / 2 - 1}" y="70" font-size="10" text-anchor="middle" fill="#666">${m}</text>`; });
  const xe = 10 + (yearEndIdx + 1) * w - 1;
  s += `<line x1="${xe}" y1="14" x2="${xe}" y2="80" stroke="#b4442f" stroke-width="2" stroke-dasharray="4 3"/><text x="${xe}" y="11" font-size="10" text-anchor="middle" fill="#b4442f">${L(T('year end', 'yil oxiri'))}</text>`;
  s += `<text x="${10 + startIdx * w}" y="92" font-size="11" fill="${color}">■ ${L(labThis)}</text><text x="${xe + 8}" y="92" font-size="11" fill="#78909c">■ ${L(labNext)}</text></svg>`;
  return s;
}

      BOX('rule', '<b>Valuing intangibles:</b> purchased intangibles are recorded at cost (all costs to make them ready for use). Internally created intangibles are generally <b>expensed</b>; only direct costs of securing the title, such as legal costs, are capitalised. <b>Goodwill example</b>: B buys A for $300,000; A’s net assets are worth $250,000 → goodwill = <b>$50,000</b>.', '<b>Nomoddiy aktivlarni baholash:</b> sotib olinganlari tannarxda. Ichkarida yaratilganlari odatda <b>xarajat</b>ga yoziladi; faqat huquqni rasmiylashtirish xarajatlari (yuridik) kapitallashtiriladi. <b>Gudvil misoli</b>: B A ni $300,000 ga oldi; A sof aktivlari $250,000 → gudvil = <b>$50,000</b>.'),

      P('<b>Debentures</b> are <b>unsecured</b> debt: investors lend relying on the issuer’s creditworthiness, receive fixed interest (coupon) and are repaid at maturity or in instalments. <b>Bonds (secured debentures)</b> are secured on specific fixed assets: if the company cannot repay, bondholders can take and sell those assets.', '<b>Debenturlar</b> — <b>kafolatsiz</b> qarz: investor emitentning ishonchliligiga tayanadi, belgilangan foiz (kupon) oladi, muddat oxirida yoki bo‘lib-bo‘lib qaytariladi. <b>Obligatsiyalar (kafolatli debenturlar)</b> muayyan aktivlar bilan ta’minlangan: qaytarilmasa, egalari o‘sha aktivlarni olib sotishi mumkin.'),
      BOX('trap', 'A loan instalment due within 12 months, and any accrued interest, is a <b>current</b> liability even if the rest of the loan is non-current. Show an overdraft as a liability, separately from positive cash balances.', '12 oy ichida to‘lanadigan kredit qismi va hisoblangan foiz — <b>joriy</b> majburiyat, qolgan qismi uzoq muddatli bo‘lsa ham. Overdraftni musbat pul qoldig‘idan alohida, majburiyat sifatida ko‘rsating.'),

      H('9.5 Equity: shares, dividends and reserves', '9.5 Kapital: aksiyalar, dividendlar va zaxiralar'),
      P('Equity = what belongs to the owners after all liabilities. It has two sources: <b>paid-in capital</b> (money shareholders invested — share capital at par + share premium) and <b>retained earnings</b> (profits kept since the company began; a claim on assets, <b>not cash</b>).', 'Kapital = barcha majburiyatlardan keyin egalarga qoladigani. Ikki manba: <b>kiritilgan kapital</b> (aksiyadorlar kiritgan pul — nominaldagi ustav kapitali + emissiya daromadi) va <b>taqsimlanmagan foyda</b> (boshidan buyon qoldirilgan foyda; aktivlarga da’vo, <b>pul emas</b>).'),

        [T('Types', 'Turlari'), T('—', '—'), T('<b>Cumulative</b>: unpaid dividends carry forward. <b>Redeemable (callable)</b>: repaid later — treated as a <b>liability</b> and its dividend as finance cost (BPP).', '<b>Kumulyativ</b>: to‘lanmagan dividend keyingi yilga o‘tadi. <b>Qaytariladigan</b>: keyin qaytariladi — <b>majburiyat</b>, dividendi moliyaviy xarajat (BPP).')],

      BOX('rule', 'Shares are recorded at <b>par (nominal) value</b>; anything received above par goes to <b>share premium</b>. Issue of 1,000 $1 shares at $2.60: <b>Dr Cash 2,600 · Cr Share capital 1,000 · Cr Share premium 1,600</b>. Share premium can never be paid out as a dividend.', 'Aksiyalar <b>nominal</b> qiymatda yoziladi; nominaldan ortig‘i <b>emissiya daromadi</b>ga. 1,000 ta $1 lik aksiya $2.60 dan: <b>Dr Pul 2,600 · Cr Ustav kapitali 1,000 · Cr Emissiya daromadi 1,600</b>. Emissiya daromadi hech qachon dividend sifatida to‘lanmaydi.'),

      BOX('trap', '<b>Two views you will meet.</b> Your slides (older UK practice) say a proposed final dividend still unpaid at the year end is a <b>current liability</b>. The lecture workings and BPP follow <b>IAS 10</b>: dividends <b>paid</b> are deducted in the SOCIE (never an expense); a dividend proposed or declared <b>after</b> the reporting date is <b>not a liability</b> — it is only disclosed in a note. Use IAS 10 in IFRS questions (e.g. Samarkand Co); old-style questions such as Village Drivers expect the liability.', '<b>Ikki xil yondashuv.</b> Slaydlaringizda (eski UK amaliyoti) yil oxirida to‘lanmagan taklif etilgan dividend — <b>joriy majburiyat</b>. Ma’ruza ishlanmasi va BPP <b>IAS 10</b> bo‘yicha: <b>to‘langan</b> dividend kapital hisobotida ayiriladi (xarajat emas); hisobot sanasidan <b>keyin</b> taklif etilgan dividend <b>majburiyat emas</b> — faqat izohda. IFRS savollarida IAS 10 (masalan Samarkand Co); Village Drivers kabi eski uslubdagi savolda majburiyat kutiladi.'),

      H('9.6 Income tax in the SFP: under- and over-provisions', '9.6 Balansdagi soliq: kam va ortiqcha hisoblash'),

      MCQ('c10q14', T('George invested $10,000. First-year profit $5,000; drawings $2,000. At the year end: non-current assets $20,000, current assets $15,000, current liabilities $8,000. How much further capital did he introduce?', 'George $10,000 kiritdi. Foyda $5,000; drawings $2,000. Yil oxirida: uzoq muddatli aktiv $20,000, joriy $15,000, joriy majburiyat $8,000. Yana qancha kapital kiritgan?'), ['$20,000', '$24,000', '$10,000', '$14,000'], 3, T('Net assets = 20,000 + 15,000 − 8,000 = 27,000 = closing capital. 10,000 + 5,000 − 2,000 + X = 27,000 → X = 14,000.', 'Sof aktiv = 27,000. 10,000 + 5,000 − 2,000 + X = 27,000 → X = 14,000.'), SRC('TW9 Part 1, Q15')),

function insertAt(chId, beforeEn, blocks) {
  const c = BOOK.chapters.find(x => x.id === chId);
  let i = c.blocks.findIndex(b => (b.t === 'h' || b.t === 'h3') && String(b.en).startsWith(beforeEn));
  if (i < 0) i = c.blocks.length;
  c.blocks.splice(i, 0, ...blocks);
}
const NEWTAG = T('New: from the slides', 'Yangi: slayddan');
function barChart(groups, series, colors, maxV, unitLab) {
  const W = 560, H = 230, x0 = 50, y0 = 190, gw = (W - x0 - 20) / groups.length, bw = Math.min(34, gw / (series.length + 1));
  let s = `<svg viewBox="0 0 ${W} ${H}" width="100%" style="max-width:${W}px;display:block;margin:auto" font-family="Segoe UI,Arial"><line x1="${x0}" y1="${y0}" x2="${W - 10}" y2="${y0}" stroke="#999"/>`;
  groups.forEach((g, i) => {
    series.forEach((se, j) => {
      const v = se.v[i], h = v / maxV * 150, x = x0 + i * gw + (gw - bw * series.length) / 2 + j * bw;
      s += `<rect x="${x}" y="${y0 - h}" width="${bw - 4}" height="${h}" rx="3" fill="${colors[j]}"/><text x="${x + (bw - 4) / 2}" y="${y0 - h - 5}" font-size="11" text-anchor="middle" fill="${colors[j]}">${v.toLocaleString('en-US')}</text>`;
    });
    s += `<text x="${x0 + i * gw + gw / 2}" y="${y0 + 18}" font-size="12" text-anchor="middle" fill="#555">${L(g)}</text>`;
  });
  s += `<g font-size="12">${series.map((se, j) => `<rect x="${x0 + j * 190}" y="4" width="14" height="14" rx="3" fill="${colors[j]}"/><text x="${x0 + 20 + j * 190}" y="16">${L(se.name)}</text>`).join('')}</g></svg>`;
  return s;
}

/* ---------- Chapter 7: direct write-off method vs allowance method ---------- */
insertAt('ch7', '7.2', [
  H3('Two ways to account for bad debts: direct write-off and allowance', 'Umidsiz qarzni hisobga olishning ikki usuli: direct write-off va allowance'),
  P('Your slides name two methods. The choice depends on whether the debt is <b>bad</b> (certain loss) or <b>doubtful</b> (possible loss).', 'Slaydda ikki usul bor. Tanlov qarz <b>umidsiz</b> (aniq yo‘qotish) yoki <b>shubhali</b> (yo‘qotish ehtimoli) ekaniga bog‘liq.'),
  TBL(['', T('I. Direct write-off method', 'I. To‘g‘ridan-to‘g‘ri hisobdan chiqarish (direct write-off)'), T('II. Allowance (provision) method', 'II. Zaxira (allowance) usuli')], [
    [T('When the expense is recorded', 'Xarajat qachon yoziladi'), T('<b>Only when</b> a specific account is known to be uncollectible', '<b>Faqat</b> muayyan qarz undirilmasligi aniq bo‘lganda'), T('At <b>each period end</b>, as an estimate, before we know which customer will not pay', '<b>Har davr oxirida</b>, taxminiy, qaysi mijoz to‘lamasligini bilmasdan oldin')],
    [T('Entry', 'Yozuv'), T('<b>Dr Bad debts expense · Cr Trade receivables</b> (the named debtor)', '<b>Dr Umidsiz qarz xarajati · Cr Debitor</b> (aniq mijoz)'), T('<b>Dr Bad debts expense · Cr Allowance for doubtful debts</b> (with the increase)', '<b>Dr Umidsiz qarz xarajati · Cr Shubhali qarzlar zaxirasi</b> (o‘sish bilan)')],
    [T('Effect on receivables', 'Debitorga ta’siri'), T('Reduces the debtor’s account directly', 'Debitor hisobini to‘g‘ridan-to‘g‘ri kamaytiradi'), T('Debtor’s account unchanged; the allowance is deducted in the SFP', 'Debitor hisobi o‘zgarmaydi; zaxira balansda ayiriladi')],
    [T('Concepts', 'Tamoyillar'), T('Simple, but the expense can fall in a <b>later</b> period than the sale, which breaks <b>matching</b>', 'Oddiy, lekin xarajat sotuvdan <b>keyingi</b> davrga tushishi mumkin — <b>moslik</b> buziladi'), T('Follows <b>prudence</b> and <b>matching</b>: the expected loss hits the same period as the sale', '<b>Ehtiyotkorlik</b> va <b>moslik</b>ka mos: kutilgan yo‘qotish sotuv davriga tushadi')],
  ]),
  FIG(() => `<div class="tgrid">${tacc(T('Debtor: A. Khan', 'Debitor: A. Khan'), [[T('Sales', 'Sotuv'), 500]], [[T('Bad debts', 'Umidsiz qarz'), 500]])}${tacc(T('Bad debts', 'Umidsiz qarz'), [[T('A. Khan', 'A. Khan'), 500]], [[T('Profit and loss', 'Foyda-zarar'), 500]])}</div>`, T('Direct write-off in the ledger: the worthless debt is removed from the debtor’s account and the bad debts account is charged to profit or loss at the year end. (Illustrative figures.)', 'Daftarda direct write-off: qadrsiz qarz debitor hisobidan olib tashlanadi, umidsiz qarz hisobi yil oxirida foyda-zararga o‘tadi. (Misol raqamlari.)')),
  BOX('key', 'Bad debt vs bad debt provision: a <b>bad debt</b> is a <b>specific</b> amount written off now (an expense in profit or loss, removed from the debtor); a <b>provision</b> is an <b>estimate</b> shown in the SFP as a deduction from debtors — it does <b>not</b> change the debtor’s own account.', 'Umidsiz qarz va zaxira: <b>umidsiz qarz</b> — hozir chiqariladigan <b>aniq</b> summa (foyda-zararda xarajat, debitordan olib tashlanadi); <b>zaxira</b> — balansda debitorlardan ayiriladigan <b>taxmin</b>, u debitorning o‘z hisobini <b>o‘zgartirmaydi</b>.'),

insertAt('ch7', PRACT.en, [

  MCQ('x7q4', T('A bad debt has occurred and an entry is needed to record it. Which best describes this entry?', 'Umidsiz qarz yuz berdi va yozuv kerak. Bu yozuvni nima eng yaxshi tasvirlaydi?'), [T('Writing off a bad debt', 'Umidsiz qarzni hisobdan chiqarish'), T('Providing for a doubtful debt', 'Shubhali qarz uchun zaxira yaratish'), T('Providing for bad debts', 'Umidsiz qarzlar uchun zaxira'), T('Charge for an increase in the provision', 'Zaxira o‘sishini xarajatga yozish')], 0, T('The debt has <b>occurred</b> (it is certain), so it is written off; provisions are for debts that only might go bad.', 'Qarz <b>yuz bergan</b> (aniq), shuning uchun hisobdan chiqariladi; zaxira — faqat umidsiz bo‘lishi mumkin bo‘lgan qarzlar uchun.'), SRC('TW7 Part 2 Q3')),

insertAt('ch8', 'Where does each item go?', [
